name: CI

# The workflow token reads the repository and does nothing else.
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default single commit. The attribution check at
      # the end of this job reads `git log`, and with depth 1 it would read one
      # commit body and pass a trailer anywhere below the tip.
      # Pinned to the Node 24 majors. GitHub removes Node 20 from the runners on
      # 2026-09-16, and checkout@v4 and setup-python@v5 both run on it, so the
      # older pins stop working rather than warning.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The layer-model, ontology and cast validators parse YAML. Without this step they
      # exit 2 rather than passing vacuously, and the kernel gate reports a
      # failure instead of a green run, so the dependency is explicit here.
      # tools/validate.py additionally needs jsonschema, which Step 7 introduced
      # and this step did not install, so every run from 4e6abda to 132eef0
      # failed with DEPENDENCY_MISSING on that one check. pytest joined at Step
      # 12 for the connector adapters' rung 1 tests, which use its fixtures.
      - name: Install validator dependencies
        run: pip install pyyaml jsonschema pytest

      # Step 9. tools/validate_divergence_register.py derives the register's
      # entry list from a diff of the PSE schema and zmeta-event-1.0, and reads
      # the upstream schema from ../ZMeta/zmeta-spec, the sibling layout of the
      # maintainer's machine. This step puts the pinned release there. The
      # register pins the file's sha256 as well, so a different copy is refused
      # rather than diffed. Without this step every divergence-register check
      # below exits 2, because the input it diffs against is absent.
      - name: Fetch the upstream schema the divergence register diffs against
        run: git clone --depth 1 --branch v1.1.27 https://github.com/JTC-byte/zmeta-spec ../ZMeta/zmeta-spec

      # Every gate step from here on carries `if: ${{ !cancelled() }}`, so it
      # runs whatever an earlier step returned. A step's default condition is
      # success(), which skips every step after the first red one. The kernel
      # gate was red on the runs for 4e6abda, 38c93cc, 132eef0 and 4a5c788, and
      # on all four the hook step and the attribution check were skipped, so two
      # mechanisms did not run while the job read as one known failure. Each
      # gate now reports its own result, and the job still fails if any does.

      # Doctrine and hygiene run first as named steps: the first reads the
      # doctrine corpus and the second reads every tracked file. The kernel
      # gate below runs the whole implemented battery and reports every check
      # that is not built yet as PENDING rather than letting an absent check
      # read as a passing one.
      - name: Doctrine integrity
        if: ${{ !cancelled() }}
        run: python tools/validate_doctrine.py

      - name: Housekeeping
        if: ${{ !cancelled() }}
        run: |
          python tools/validate_hygiene.py
          python tools/validate_hygiene.py --self-test

      # The mechanisms that exist, exercised against the criteria that claim
      # them. Design gate 1 counts a constraint as done only when a test fails
      # if it is removed. The subject guard's tests joined at Step 10 and run
      # here as well as inside the kernel gate, so a guard regression turns this
      # step red rather than joining a kernel gate already red for a disclosed
      # reason.
      - name: Mechanism tests
        if: ${{ !cancelled() }}
        run: |
          python tools/tests/test_gate_log.py
          python runner/tests/test_subject_guard.py

      # Rung 1 of the conformance ladder for every connector: the adapter
      # against its own cassettes, replay only. No test runs a connector, Docker
      # or a network request; every test that calls invoke() replaces the
      # process call first.
      - name: Connector adapter tests
        if: ${{ !cancelled() }}
        run: python -m pytest connectors -q -p no:cacheprovider

      # Joined 2026-10-28 (reading APP-R30). The store, the ingest door, the
      # loopback server and its routes, the egress guard, the notice stream and
      # the static front end, over the must-pass corpus, with each check's
      # paired negative control run inside the suite by app/tests/test_controls.py.
      # --tb=short keeps a failure's report to the failing line and its
      # assertion message rather than each frame's full source, so a failing run
      # prints as little of the fixtures as pytest allows; the corpus it reads is
      # synthetic and holds placeholders only. Every store lives under a temporary
      # directory, and the only listener and the only connections are on
      # 127.0.0.1. The kernel gate below runs the same command again.
      - name: Application tests
        if: ${{ !cancelled() }}
        run: python -m pytest app -q --tb=short -p no:cacheprovider

      # The ten validator self-tests no other step runs, one named step each.
      # Hygiene's runs in the Housekeeping step and tools/validate.py's inside
      # the kernel gate step. A self-test breaks the governed artifact in memory and
      # asserts that each break is refused, so it is the test that fails when a
      # check is removed. Until 2026-09-28 none of these five ran on any
      # automated path, and a failing layer-model self-test read as green for
      # two sessions because nothing ran it. These run as named steps before
      # the kernel gate, so a self-test that breaks turns its own step red
      # rather than joining a kernel gate that is already red for a disclosed
      # reason. The kernel gate runs all eleven again.
      - name: Layer-model self-test
        if: ${{ !cancelled() }}
        run: python tools/validate_layer_model.py --self-test

      - name: Ontology self-test
        if: ${{ !cancelled() }}
        run: python tools/validate_ontology.py --self-test

      - name: Cast self-test
        if: ${{ !cancelled() }}
        run: python tools/validate_cast.py --self-test

      - name: Authorization self-test
        if: ${{ !cancelled() }}
        run: python tools/validate_authorization.py --self-test

      - name: Retention self-test
        if: ${{ !cancelled() }}
        run: python tools/validate_retention.py --self-test

      # Joined 2026-10-01. The doctrine gate had no self-test and refused once in
      # 348 runs; the pin-of-record reader is the one predicate the doctrine,
      # authorization and retention gates use to decide what binds.
      - name: Doctrine self-test
        if: ${{ !cancelled() }}
        run: python tools/validate_doctrine.py --self-test

      - name: Pin-of-record self-test
        if: ${{ !cancelled() }}
        run: python tools/pin_of_record.py --self-test

      # Joined at Step 9. Breaks the divergence register, the two derived
      # tables, the corpora and the tree in memory and asserts each of the six
      # checks refuses by its own code.
      - name: Divergence-register self-test
        if: ${{ !cancelled() }}
        run: python tools/validate_divergence_register.py --self-test

      # Joined at Step 12. Breaks a placeholder-only manifest in memory and its
      # fixtures on a scratch disk, and asserts each break is refused by its own
      # code, among them a retain disposition and an unstamped R7.
      - name: Manifest self-test
        if: ${{ !cancelled() }}
        run: python tools/validate_manifest.py --self-test

      # Joined with the first connector at Step 12. Plants each defect in a
      # scratch copy of connectors/sherlock outside the repository, among them a
      # known negative altered to a hit and invoke reachable without a permit,
      # and asserts each is refused by its own code. It runs no connector.
      - name: Connector conformance self-test
        if: ${{ !cancelled() }}
        run: python tools/validate_connector_conformance.py --self-test

      - name: Kernel gate
        if: ${{ !cancelled() }}
        run: python tools/validate_conformance.py --kernel-gate

      # The pre-commit hook is the primary enforcement, because git history is
      # the one store a crypto-shred cannot reach and CI runs after the commit
      # already exists. This step proves the hook itself still runs, so a hook
      # that silently stops working is caught here rather than never.
      - name: Pre-commit hook is executable and runs
        if: ${{ !cancelled() }}
        run: |
          test -x .githooks/pre-commit || { echo ".githooks/pre-commit is not executable"; exit 1; }
          git config core.hooksPath .githooks
          sh .githooks/pre-commit

      # An agent may never land a Class F change, and a Class F commit is
      # authored by the ratifier (CLAUDE.md section 5, R6 stamped 2026-08-27).
      # Attribution is checkable, so it is checked.
      - name: No agent co-authorship trailers
        if: ${{ !cancelled() }}
        run: |
          if git log --format='%B' | grep -iE '^Co-Authored-By:.*(claude|anthropic|assistant)'; then
            echo ""
            echo "REFUSED ATTRIBUTION_TRAILER_PRESENT"
            echo "  rule:  CLAUDE.md section 5, R6 stamped 2026-08-27"
            echo "  what:  a commit carries a Co-Authored-By trailer naming an agent"
            echo "  moves: amend the commit to remove the trailer, or reopen R6"
            exit 1
          fi
          echo "attribution ok: no agent trailers in history"

      # GitHub's rebase and squash merges write a new commit whose committer is
      # the merging account's own name and commit email. On 2026-11-09 that put
      # the operator's personal email address on five commits of main, after
      # the rewrite of 2026-09-07 had taken it out of the whole history, and
      # main was rewritten again on 2026-11-10 (the worklog entry of that date).
      # An address is checkable, so it is checked: every author and committer
      # address in the history must be a GitHub no-reply address. The refusal
      # prints hashes and never an address. This step runs after a commit
      # exists, so it finds such a commit at its first push and cannot prevent
      # one; section 7 of docs/plainsight_handoff.md names the route that does.
      # On a pull request it reads the pull request's own head, because the
      # merge commit GitHub builds for the run is not part of the history.
      - name: Commit identities are no-reply addresses
        if: ${{ !cancelled() }}
        run: |
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e "$head^{commit}"
          list=$(mktemp)
          git log --format='%H %ae %ce' "$head" > "$list"
          total=$(wc -l < "$list")
          test "$total" -gt 0
          bad=$(awk '$2 !~ /@users\.noreply\.github\.com$/ || $3 !~ /@users\.noreply\.github\.com$/ { print $1 }' "$list")
          rm -f "$list"
          if [ -n "$bad" ]; then
            echo "REFUSED COMMIT_IDENTITY_NOT_NO_REPLY"
            echo "  rule:  docs/plainsight_handoff.md section 7, the landing rule; CHANGELOG.md, the entries of 2026-09-07 and 2026-11-10"
            echo "  what:  the commits below carry an author or committer address that is not a GitHub no-reply address"
            echo "$bad" | sed 's/^/           /'
            echo "  moves: push nothing further onto this history and tell the maintainer, since taking an address out of a pushed commit is a rewrite only he decides; set the commit identity to the account's no-reply address before the next commit; land work by a fast-forward push of the reviewed head and never by GitHub's rebase or squash merge, which writes the merging account's own address"
            exit 1
          fi
          echo "identities ok: $total commit(s) read, every author and committer address a GitHub no-reply address"
