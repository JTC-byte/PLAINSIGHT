# policy/subject-authorization.yaml
#
# The subject doctrine compiled. doctrine/SUBJECT_SELECTION.md SS-1 to SS-21 is
# the source of record, and this file is the machine-readable form of it: the
# closed class set, the evidence each class requires, the authorization record's
# required fields, the gate's three values and its six-step evaluation order,
# the bystander rules, and the absolute prohibitions. runner/subject_guard.py
# has nothing to enforce without it, which is why docs/THE-GAMEPLAN.md section 2
# records that no run may execute before it exists.
#
# HAND-AUTHORED, AND SAID SO BECAUSE THE NEIGHBOURS ARE NOT. The four generated
# files in this directory open with "GENERATED by tools/generate_pse.py from
# spec/layer-model.yaml. Do not edit by hand." That generator owns exactly five
# outputs, schema, semantics, lineage, producer-authority and violation-codes,
# and `tools/generate_pse.py --check` refuses drift in those five alone. This
# file is not one of them and is not generated. It is compiled by a person from
# rank 1 doctrine, on the ontology/selectors.yaml precedent.
#
# WHAT REFUSES ITS DRIFT. tools/validate_authorization.py is the self-lint, and
# it reconciles in three directions: every enum below against the rank 3 mirror
# in spec/layer-model.yaml, every criterion id below against the stamp table in
# doctrine/DOCTRINE_STATUS.md, and every violation code named below against
# policy/violation-codes.yaml. A generator sourced from the layer model would
# invert a stated relationship, because spec/layer-model.yaml says in its own
# comment on subject_class that it mirrors the doctrine and does not decide it
# and that this file is the compiled source. A generator would also take a
# Class F artifact out of the ratifier's hands.
#
# AUTHORITY. Rank 3, Class F (CLAUDE.md section 2, AGENTS.md section 3). Rank 1
# doctrine wins every conflict with this file. Where rank 1 disclaims a question
# as a schema question, which SUBJECT_SELECTION.md does for field names, layer
# boundaries and interface design, the authority order sends the question to
# rank 3, and the entries below record which source bound it.
#
# THIS FILE IS UNRATIFIED AND IT REFUSES. Nothing here binds until the operator
# stamps it in doctrine/DOCTRINE_STATUS.md. That file is the pin of record:
# "Mechanisms read this file rather than the document they enforce. An
# unratified criterion refuses rather than permits." SS-14 item 6 names this
# path as one of the artifacts that must be stamped before any collection at
# all, including collection against a synthetic account. A mechanism that reads
# this file while it is unstamped refuses the dispatch it was asked to permit
# and names the entry that refused.
#
# WHERE DOCTRINE DOES NOT DECIDE, THIS FILE DOES NOT DECIDE EITHER. Sixteen
# questions below are open. Each one lands in subject_authorization.unratified
# as a named entry carrying the question, the legal options with their costs,
# what it blocks, and the sentence a mechanism renders when it refuses. None of
# them carries a plausible default. A threshold, duration, enum member or
# ordering invented here would be an agent deciding a Class F question, and the
# refusal is the designed state rather than an unfinished one.
#
# NO VALUE APPEARS IN THIS FILE. SS-14 item 5 keeps a selector belonging to a
# natural person out of every tracked file, and SS-8 forbids a per-selector
# never-collect list specifically, because such a list is a permanent register
# of real people's selectors in a tracked file. Section 7 of the doctrine
# contains no selector values and names no file holding any. Neither does this
# one.
#
# NO VIOLATION CODE IS MINTED HERE. The code vocabulary is spec/layer-model.yaml
# and policy/violation-codes.yaml is its generated form, append-only once
# shipped. This file cites codes by name and mints none, on the
# ontology/selectors.yaml precedent.
#
# VOICE. CLAUDE.md section 4, Register 1. Comments say why a rule exists and
# cite the file and criterion id that requires it. They do not cite line
# numbers, which drift. Every state below is rendered as its consequence rather
# than as its token, which is SS-7's rule and CLAUDE.md section 4's extension of
# it: an operator cannot act on a bare string.

subject_authorization:
  version: 0.1
  authority_rank: 3
  change_class: F
  closed: true
  status: DRAFT 2026-09-11, compiled by an agent from rank 1 doctrine, UNRATIFIED
  binds: false
  # binds flips to true when doctrine/DOCTRINE_STATUS.md carries a dated row for
  # this path, authored by the ratifier. Until then every reader refuses. The
  # state lives in the pin of record rather than here; this key is the loader's
  # copy of it and the pin wins if the two ever disagree.

  compiled_from: doctrine/SUBJECT_SELECTION.md
  stamp_of_record: doctrine/DOCTRINE_STATUS.md
  self_lint: tools/validate_authorization.py
  code_vocabulary: spec/layer-model.yaml
  carries_decisions: [D5, R4, R7, R8]
  # D5 is the three-valued gate, R4 the subject classes at maximum reach, R7 the
  # interaction line, R8 the v0.1 bystander disposition pair. All four are
  # stamped in the pin of record. This file compiles them and decides none of
  # them.

  compiles_criteria:
    - SS-1
    - SS-2
    - SS-3
    - SS-4
    - SS-5
    - SS-6
    - SS-7
    - SS-8
    - SS-9
    - SS-10
    - SS-11
    - SS-12
    - SS-13
    - SS-14
    - SS-15
    - SS-16
    - SS-17
    - SS-18
    - SS-19
    - SS-20
    - SS-21

  read_by:
    - path: runner/subject_guard.py
      how: evaluate() reads the class set, the record rules, the three values and
        the six-step order. Step 10.
    - path: tools/validate_authorization.py
      how: --fixtures grades conformance/gate/*.jsonl against this file, and
        --dispatch-paths proves nothing reaches argv, a subscription or the
        credential pool around the gate. Step 8.
    - path: schema/subject-authorization.schema.json
      how: refuses a subject_class outside the authorizable enum below, and
        refuses a partial record. SS-1 and SS-4.
    - path: spec/layer-model.yaml
      how: AUTHORIZE_EVENT subject_class and COLLECT_EVENT decision mirror the
        enums below. The mirror declares itself a mirror.
    - path: conformance/gate/*.jsonl
      how: every fixture asserts a value and a basis drawn from this file.
        Synthetic records only.
    - path: policy/retention.yaml
      how: SS-11's incidental TTL is enforced there under RT-6, and the
        authorization record's stratum is declared there under RT-1.

  not_here:
    - The bystander class vocabulary. SS-10 assigns the manifest field's name,
      its value encoding and where it sits in the document to
      schema/connector-manifest.schema.json at Step 12, and says this file has
      no opinion on them. What SS-10 delivers with these drafts is the closed
      disposition set below, the violation code for an undeclared or out-of-set
      disposition, and one must-fail manifest fixture.
    - Which subject class a selector belongs to. SS-1 puts the class in the
      authorization record and rules out inference from a selector value
      permanently.
    - The retention numbers. The case TTL, the incidental TTL and the ceiling
      are RETENTION.md RT-5 and RT-6, compiled in policy/retention.yaml.
    - The authorization record's field shapes and formats. SUBJECT_SELECTION.md
      disclaims field names, so schema/subject-authorization.schema.json carries
      the shapes and spec/layer-model.yaml already types the wire analogues.
    - The connector manifest's interaction_class. R7 is stamped and the check
      lands at Step 12.

  # --------------------------------------------------------------- scope note
  scope_note:
    # SUBJECT_SELECTION.md, scope note. Carried here because a compiled policy is
    # read by people who will not open the doctrine first.
    grants_no_authority: Nothing in this file grants an authority the operator
      does not already hold.
    above_every_rule_here:
      - statutory obligations
      - platform terms of service
      - commitments made outside this repository
    permitted_means: A permitted return from the gate means the runner will
      construct argv. It means nothing else.

  # ------------------------------------------------------------- ratification
  ratification:
    # doctrine/DOCTRINE_STATUS.md is the only source a mechanism reads for
    # whether a criterion binds. SUBJECT_SELECTION.md says so in its own header:
    # runner/subject_guard.py reads the pin, not the prose. Any status this file
    # carries is documentation and the pin breaks no tie, because there is no
    # tie to break.
    pin_of_record: doctrine/DOCTRINE_STATUS.md
    predicate: A criterion is stamped when it has a row in the Step 3
      per-criterion table and its file carries a dated ratifier row in the
      Ratified table. The Step 3 table is the mechanism rather than an index of
      one, and it says so.
    basis_is_not_required: true
    # doctrine/DOCTRINE_STATUS.md records that every basis stamp blocks "nothing
    # mechanical" and that conclusions bind while bases are unread. Requiring a
    # basis would make every reader refuse every invocation, which no criterion
    # asks for.
    absent_row: A criterion with no row refuses rather than permits.
    state_of_record:
      criteria: SS-1 to SS-21, all criteria
      conclusion_stamped: 2026-08-27
      basis_stamped: unstamped, deliberately
      ratifier: operator
      version: v0.1
    this_file:
      stamped: false
      blocks: every collection run, under SS-14 item 6
      refuses: |-
        REFUSED PENDING RATIFICATION
          where: doctrine/DOCTRINE_STATUS.md, no row for
                 policy/subject-authorization.yaml
          what:  the subject gate was asked to permit a dispatch and the policy
                 it reads is unstamped. SS-14 item 6 refuses all collection,
                 including collection against a synthetic account, until this
                 path is stamped in the pin of record, and an unstamped criterion
                 refuses rather than permits
          moves: stamp this path in doctrine/DOCTRINE_STATUS.md with a date and a
                 ratifier; or resolve the entries under
                 subject_authorization.unratified first, since several of them
                 decide what the gate compares; or run nothing, which is the
                 state this refusal is holding

  # ------------------------------------------------------------------ classes
  classes:
    # SS-1. The class set is closed at v0.1 and carries eight members. A selector
    # belongs to exactly one class per case. Widening this set is Class F and
    # carries R4.
    closed: true
    per_case: true
    members:
      - id: S0
        name: SELF
        definition: An account the operator holds and controls
        v0_1: available
        authorizable: true
        evidence_required: Credential possession, recorded once per account
        evidence_object: credential record
        conditions: []
        unratified_dependencies: [SA-U10]
      - id: S1
        name: CONSENTING
        definition: A living person who has given recorded, revocable, per-case
          consent
        v0_1: available
        authorizable: true
        evidence_required: A consent record naming the person, the case purpose,
          the classes of data, and an expiry
        evidence_object: consent record
        conditions: []
        unratified_dependencies: [SA-U5, SA-U8]
      - id: S2
        name: SYNTHETIC
        definition: A persona in synthetic/CAST.md, created by the team,
          interacting only with the cast
        v0_1: available
        authorizable: true
        evidence_required: Presence in the sealed cast manifest
        evidence_object: cast manifest entry
        conditions: []
        unratified_dependencies: [SA-U10]
      - id: S3
        name: PUBLIC FIGURE
        definition: A person whose public role is argued to make them a
          legitimate subject
        v0_1: available, behind SS-17
        authorizable: true
        evidence_required: A written statement of the public role relied on,
          recorded per case
        evidence_object: written statement
        conditions: [baseline_scorecard_exists]
        unratified_dependencies: [SA-U2, SA-U6, SA-U7]
      - id: S4
        name: ARBITRARY THIRD PARTY
        definition: Anyone else
        v0_1: available, behind SS-17
        authorizable: true
        evidence_required: A written purpose naming why this person, recorded
          per case
        evidence_object: written statement
        conditions: [baseline_scorecard_exists]
        unratified_dependencies: [SA-U2, SA-U6, SA-U7]
      - id: S5
        name: INCIDENTAL
        definition: A person whose data arrives as a byproduct of collecting on
          any authorized node, person or organization or location
        v0_1: available, never as a target
        authorizable: false
        evidence_required: Not authorizable
        evidence_object: null
        conditions: []
        never_authorizable_because: SS-1 marks the class not authorizable and
          SS-4 excludes it from the record's subject_class field. An
          authorization naming it would be an authorization for a class no
          authorization reaches.
        recorded_as: computed
        # SS-10. subject_relation is a computed column with values seed, pivot
        # and incidental, never an asserted one, and the runner computes it from
        # the pivot chain. S5 is therefore never stored on a record; it is the
        # incidental relation observed on a chain. A connector cannot claim its
        # collection was incidental.
      - id: N0
        name: NON-PERSON
        definition: A selector that does not belong to a natural person, an
          organization, a company, an institutional or role account, a published
          corporate domain
        v0_1: available
        authorizable: true
        evidence_required: A written statement that the selector is
          institutional, recorded per case
        evidence_object: written statement
        conditions: []
        unratified_dependencies: [SA-U2]
      - id: L0
        name: LOCATION
        definition: A place that is not a person's home, a venue, campus, office,
          public space, or a coordinate box
        v0_1: available
        authorizable: true
        evidence_required: A written statement that the location is not a
          residence, recorded per case
        evidence_object: written statement
        conditions: []
        unratified_dependencies: [SA-U2]

  authorizable_subject_class:
    # SS-4's field set is the eight above minus S5. Two enums, not one: the class
    # set a selector may hold per case, and the values the record's subject_class
    # field may take.
    closed: true
    enum: [S0, S1, S2, S3, S4, N0, L0]
    excluded: [S5]
    mirrored_at: spec/layer-model.yaml event_types.AUTHORIZE_EVENT.payload.fields.subject_class.enum
    widening_is: Class F by effect, whatever the diff looks like
    refuses: |-
      REFUSED PENDING AUTHORIZATION
        where: the authorization record's subject_class
        what:  the record names a class outside SS-1's authorizable set. S5 is in
               the class set and is not in this one, because SS-1 marks it not
               authorizable and SS-4 excludes it from the field
        moves: name one of S0, S1, S2, S3, S4, N0 or L0 with the evidence that
               class requires; or, for a person who arrived incidentally, open a
               new case with their own written record under S3 or S4, which is a
               decision rather than a refusal; or drop the selector

  class_rules:
    - id: gate_reads_the_class
      criterion: SS-1
      rule: The gate reads the class from the authorization record and refuses
        when no record covers the selector. It does not decide which class a
        selector belongs to.
      inference_from_a_selector_value: out of scope permanently
      why: Inferring a class means guessing whose account a handle is, using the
        same correlation machinery whose guesses are the thing under test.
    - id: n0_never_reaches_members
      criterion: SS-1
      rule: N0 authorizes the organization and never its members. Every person an
        organization enumeration returns is S5 INCIDENTAL on arrival and cannot
        become a pivot origin.
      promotion: Promoting one to a target requires that person's own
        authorization record under whichever of S0, S1, S2, S3 or S4 they belong
        to.
      keys_on: the per-case class, never the selector value
      fixture: conformance/gate/ refuses an S5-classed selector dispatched as a
        seed inside the same case.
    - id: n0_is_not_self_certifying
      criterion: SS-1
      rule: A selector is institutional because a person wrote that down in the
        authorization record, not because the gate judged it so.
      why: A role account named for a person is a natural person's selector
        wearing an institutional label, and the written statement is what makes
        that call reviewable.
    - id: l0_residential_carveout
      criterion: SS-1
      rule: A residential address tied to an individual is that person's selector
        and inherits their class. It is not an L0 node. A coordinate box drawn on
        a map is L0, and a house inside it is not.
      why: Without this line the location class is the route by which a home
        address becomes infrastructure and stops being personal data.
    - id: enumeration_produces_inert_nodes
      criterion: SS-16
      rule: A deep dive on a node is a separate authorized act and nothing spawns
        one automatically. A discovered person needs their own authorization
        record and their own class.
      depth: unbounded against an authorized subject
      breadth: deliberate. Chaining ten deep dives is permitted, and
        auto-expanding one enumeration into ten runs is not.

  # -------------------------------------------------- the authorization record
  record:
    # SS-4. A partial authorization is refused, never half-honoured. Every field
    # is required because every field answers a question a reviewer will ask, and
    # a record missing one raises rather than proceeding with the rest.
    criterion: SS-4
    partial_is_refused: true
    required_fields:
      - field: case_id
        answers: Which case this authorizes, opaque, no subject name
      - field: subject_class
        answers: One of the authorizable enum above. Never S5
      - field: selectors
        answers: The exact seed selectors authorized, typed against
          ontology/selectors.yaml
      - field: pivot_depth_max
        answers: How far a chain may walk from a seed before it needs a new
          decision
      - field: purpose
        answers: Why this case exists, in one sentence, bound to the case at
          creation, stated without naming or describing the subject, on the same
          rule as case_id
      - field: evidence_ref
        answers: The consent record, credential record, or cast manifest entry
        unratified_dependencies: [SA-U2, SA-U11]
      - field: authorized_by
        answers: The ratifier
      - field: authorized_on
        answers: The date
      - field: expires_on
        answers: The date after which the record no longer authorizes anything
        unratified_dependencies: [SA-U3, SA-U4, SA-U5]
    purpose_constraint:
      one_sentence: true
      bound_to_the_case_at_creation: true
      names_or_describes_the_subject: refused
      why: RETENTION_LEDGER.md carries a copy of the purpose in a tracked file
        that survives every shred. If a purpose cannot be stated that way, the
        ledger carries the hash of the purpose record and the sentence stays
        inside the case boundary.
      code: CASE_PURPOSE_UNBOUND
    location:
      stratum: 1
      lives: inside the case boundary under the case key
      dies_with: the case
      in_the_repository: never, under any circumstance
      why: An S1 consent record names a living person, so the authorization
        record is the one object carrying both a selector and a name.
      fixtures: conformance/gate/*.jsonl holds synthetic records only.
      on_the_wire: AUTHORIZE_EVENT carries the record's id, class, expiry and
        depth. purpose and evidence_ref on an event are refused under
        AUTHORIZATION_RECORD_INLINED.
    fields_proven_read:
      # SS-5, the criterion that exists because of a measured defect. In
      # zisr-recon's guard.py as measured on 2026-08-26, scope was declared,
      # required and printed, and check() never read it, so a complete
      # authorization permitted every non-NEVER address on earth. expires_on did
      # not exist at all. A field that no fixture can make refuse is not being
      # read, whatever the code looks like.
      criterion: SS-5
      fields: [selectors, pivot_depth_max, expires_on]
      rule: For each field, conformance/gate/*.jsonl carries a fixture identical
        to a passing fixture except in that one field, and that fixture is
        refused.
      enforced_by: tools/validate_authorization.py --fixtures, which fails if any
        of the three is missing.

  pivot_depth:
    criterion: SS-4, section 9
    field: pivot_depth_max
    unit: hops a chain may walk from a seed before it needs a new decision
    minimum: 0
    zero_means: the chain may not walk, and the record authorizes its seeds only
    sentinel_for_unbounded: none. spec/layer-model.yaml types the field as an
      integer with minimum 0 and admits no null or string sentinel.
    policy_ceiling: none. Section 9 records that nothing in the doctrine sets a
      ceiling on how deep a decision may go, and that there is no aggressiveness
      budget, no run quota and no rate cap. A ceiling added here would bound
      reach the doctrine declined to bound.
    at_the_limit: REQUIRES_EXTENSION, not REFUSED. The analyst raises it.
    constrains: reaching a new person without a decision, not depth as such

  # --------------------------------------------------------------------- gate
  gate:
    criterion: SS-6, SS-7, SS-8, SS-9, SS-19
    placement:
      inside: the runner
      after: pivot selection
      before: [argv construction, the credential draw]
      why: A credential drawn is heat spent whether or not the request goes out,
        and a gate the analyst consults rather than passes through is reassurance
        without protection.
      proven_by: tools/validate_authorization.py --dispatch-paths
      covers: [argv construction, opening a subscription, drawing from the
        credential pool]
      exemptions: runner/dispatch_allowlist.yaml, each with a written reason
      why_the_credential_clause: A draft of this check covered argv and
        subscriptions only, which would have passed a call site that draws a
        credential before the gate.
    reads: [the authorization record, the pivot chain]
    never_reads: the content of a collected field
    evaluates: the composed pivot chain, not the current hop
    why_the_chain: Three individually legal hops can compose into a selector
      outside the authorized set, and a gate that evaluates only the current hop
      passes all three and lands somewhere nobody authorized.

    values:
      # SS-7 gives the three values and their consequences. The casing is rank 3:
      # SUBJECT_SELECTION.md disclaims field names and interface design, and
      # spec/layer-model.yaml already ships PERMITTED, REQUIRES_EXTENSION and
      # REFUSED as COLLECT_EVENT subtypes and as the payload decision enum,
      # generated into schema/pse-event-0.1.schema.json and policy/lineage.yaml.
      # SS-7's lowercase names the same three values.
      closed: true
      enum: [PERMITTED, REQUIRES_EXTENSION, REFUSED]
      mirrored_at: spec/layer-model.yaml event_types.COLLECT_EVENT.payload.fields.decision.enum
      members:
        - value: PERMITTED
          doctrine_token: permitted
          stops_the_run: false
          consequence: The run proceeds. The runner will construct argv, and that
            is the whole of what this value means.
        - value: REQUIRES_EXTENSION
          doctrine_token: requires_extension
          stops_the_run: true
          is_not: a warning, and not a prompt rendered over a request already in
            flight
          means: an analyst could legitimately authorize this, and has not
          consequence: |-
            REFUSED PENDING AUTHORIZATION. This selector is outside the case
            authorization. The run did not execute and nothing was collected.
            Extend the authorization, narrow the pivot, or drop it.
        - value: REFUSED
          doctrine_token: refused
          stops_the_run: true
          consequence: |-
            REFUSED. This selector is in a class this case may not collect on. No
            authorization file unlocks it.
          unratified_dependencies: [SA-U1]
          # SS-7's refused sentence describes a class refusal. Four of the bases
          # below are refusals a corrected authorization file does unlock, and
          # rendering this sentence over them would tell an analyst something
          # untrue about their own record. SA-U1 holds the question.

    evaluation_order:
      # SS-8. Hard refusals first, unconditionally, because a hard refusal a
      # config file can unlock is not a hard refusal. The value each step returns
      # is fixed by rank 3 where rank 1 is silent: spec/layer-model.yaml closes
      # refusal_basis and extension_basis, and every assignment below is
      # corroborated by SS-4, SS-7 or section 9 rather than contradicted.
      recorded_on_the_wire_as: COLLECT_EVENT payload decided_at_step, enum 1 to 6
      steps:
        - step: 1
          checks: The NEVER list. Refused whatever any file says.
          returns: REFUSED
          basis: never_item
          basis_field: refusal_basis
          note: A present, complete, valid, unexpired authorization record must
            not unlock a hard refusal, and conformance/gate/*.jsonl carries the
            fixture asserting that.
        - step: 2
          checks: Authorization record present, complete, and unexpired for this
            case.
          returns: REFUSED
          basis: [authorization_missing, authorization_incomplete,
            authorization_expired]
          basis_field: refusal_basis
          code: SUBJECT_NOT_AUTHORIZED
          note: SS-4 refuses a partial authorization rather than half-honouring
            it, so incomplete is a refusal at this step rather than a degraded
            permit.
          unratified_dependencies: [SA-U1, SA-U3]
        - step: 3
          checks: subject_class is in the set available at this version, and for
            S3 or S4 the SS-17 baseline condition is met.
          returns: REFUSED
          basis: [class_unavailable, baseline_missing]
          basis_field: refusal_basis
          note: This is the enforcement point for SS-17. Without this step the
            baseline is an intention.
          fixture: conformance/gate/ carries a matched pair on one authorization
            record declaring subject_class S4, refused with no baseline scorecard
            on file and permitted with one present. A single fixture proves only
            that something refuses; the pair proves the gate is reading the
            condition.
          unratified_dependencies: [SA-U6, SA-U7]
        - step: 4
          checks: Selector inside the authorized set, or inside pivot_depth_max
            of it.
          returns: REQUIRES_EXTENSION
          basis: [selector_outside_set, pivot_depth_exceeded]
          basis_field: extension_basis
          note: Section 9 states that a chain reaching the limit returns
            requires_extension rather than refused.
        - step: 5
          checks: Composed pivot chain inside the authorized set.
          returns: REQUIRES_EXTENSION
          basis: chain_scope_drift
          basis_field: extension_basis
          code: SCOPE_DRIFT_UNADJUDICATED
          fixture: scope-drift-three-hops
        - step: 6
          checks: Bystander declaration present for this connector, with a
            disposition inside the closed set.
          returns: REFUSED
          basis: [bystander_undeclared, disposition_out_of_set]
          basis_field: refusal_basis
          code: BYSTANDER_DISPOSITION_OUT_OF_SET
          unratified_dependencies: [SA-U9]
          # No connector manifest schema exists at Step 8, so there is no
          # document for this step to read. Whether that absence refuses every
          # dispatch or passes until Step 12 decides whether a stamped six-step
          # order runs as five, which is SA-U9.
      out_of_band:
        - checks: The pre-flight record carries an incidental-count estimate, or
            the token unestimable with a reason. A blank field is a refusal.
          criterion: SS-12
          returns: REFUSED
          basis: incidental_estimate_missing
          basis_field: refusal_basis
          code: INCIDENTAL_ESTIMATE_MISSING
          checked_by: subject_guard.evaluate()
          fixture: conformance/gate/ asserts refusal when the field is absent.
          unratified_dependencies: [SA-U12, SA-U13, SA-U16]

    argv_construction:
      criterion: SS-19
      rule: A selector whose value does not match its registered matcher in
        ontology/selectors.yaml is refused at argv construction rather than
        escaped.
      why: Escaping is a transformation that can be got wrong once, and a refusal
        cannot.
    collected_content:
      criterion: SS-19
      rule: No collected value causes a subject to be reached or data to leave
        the machine.
      fixture: conformance/gate/ carries a fixture where a collected bio contains
        a plausible instruction to collect on a second selector, asserting the
        gate refuses.

  # ---------------------------------------------------------------- bystanders
  bystanders:
    criterion: SS-10, SS-11, SS-12, SS-16
    why: These tools collect on populations. One channel subscription collects
      the message text of every member in order to observe one, a follower-list
      expansion on an account with 900 followers creates 900 selector records,
      and an organization enumeration walks an entire staff to find one employee.
    never_pass_through_the_gate: true
    why_not_the_gate: Bystanders arrive as a byproduct rather than as a target,
      so the gate cannot be the control. The manifest declaration is.
    declaration:
      required_of: every connector that reaches beyond its named selector
      declares: what it reaches and what happens to that data
      undeclared_class: refused at manifest validation rather than flagged
      class_vocabulary_settled_at: schema/connector-manifest.schema.json, Step 12
      delivered_now: the closed disposition set below, the violation code for an
        undeclared or out-of-set disposition, and one must-fail manifest fixture
    dispositions:
      closed: true
      enum: [count_only, refuse]
      decision: R8, stamped 2026-08-27
      defined_and_refused: [retain]
      retain_note: retain is defined and refused, on the same pattern SS-1 uses
        for S3 and S4. Reaching it is a Class F ratification with a dated stamp,
        and CLAUDE.md gate 2 names a bystander disposition of retain as one of
        the one-line diffs that widens who is collected on while reading as
        Class B.
      out_of_set: refused at manifest validation rather than defaulted
      mirrored_at: spec/layer-model.yaml event_types.COLLECT_EVENT.payload.fields.bystander_disposition.enum
      fixture: conformance/gate/ asserts that disposition retain is refused.
      open_beyond_the_two: R8 remains open on whether a third disposition exists.
        SS-10 defers that rather than deciding it, and closing the v0.1 set does
        not decide it.
    subject_relation:
      computed: true
      enum: [seed, pivot, incidental]
      asserted_by_a_connector: refused
      computed_from: the pivot chain
      mirrored_at: spec/layer-model.yaml event_types.COLLECT_EVENT.payload.fields.subject_relation.enum
    incidental_is_never_a_pivot_origin:
      rule: An S5 selector is not a seed for anything.
      fixture: conformance/gate/ carries the refusal fixture.
      same_person_in_a_new_case: a decision rather than a refusal, under a written
        S3 or S4 record
    incidental_estimate:
      criterion: SS-12
      required_on: the pre-flight record
      legal_values: an integer, or the token unestimable with a reason
      blank: a refusal
      why_unestimable_exists: A follower-list expansion knows its count before
        dispatch and an organization enumeration does not know how many people it
        will surface until it has surfaced them. Refusing the second shape
        outright would remove the capability.
      mirrored_at: spec/layer-model.yaml event_types.COLLECT_EVENT.payload.fields.incidental_estimate
      unratified_dependencies: [SA-U12, SA-U13]
    incidental_ttl:
      criterion: SS-11, enforced in RETENTION.md RT-6
      rule: Incidental content expires at the shorter of the case TTL and the
        incidental TTL, and an extension of the case does not extend it.
      number_lives_in: policy/retention.yaml
      storage_note: PLAINSIGHT-design.md puts messages in a separate table
        partitioned by case and then month. That choice is load-bearing for
        retention, because it is what makes independent shredding of the
        bystander-dominant class possible.

  # ------------------------------------------------------- the SS-17 baseline
  baseline:
    criterion: SS-17
    rule: An S3 or S4 run requires a baseline scorecard against S0, S1 or S2
      subjects to exist. The gate reads whether at least one scorecard exists
      against a class where precision and recall are computable, and refuses an
      S3 or S4 run until one does.
    scope: at least one, program-wide. Per-connector scoping is foreclosed by the
      words "at least one".
    enforced_at: gate evaluation step 3
    override: a dated Class F entry
    why_an_override_exists: A gate with no override in a one-person program is a
      gate that gets removed the first time it is inconvenient, and removed
      silently. A gate with a dated Class F override is one that gets used
      visibly, and the entry is the record of the decision.
    unratified_dependencies: [SA-U6, SA-U7]

  # -------------------------------------------------------------- consent, S1
  consent:
    criterion: SS-2
    per_case: true
    carries_to_the_next_case: false
    revocable: true
    revocation_is: an event, and its effect is that the case shreds on the same
      path an expiry would take, not a slower one
    expiry_required: true
    no_expiry: refused at schema validation rather than defaulted
    why: A default expiry written by the system is the system consenting on the
      subject's behalf.
    standing_consent: offered to the operator and declined
    record_names:
      - the person
      - the case purpose
      - the classes of data
      - an expiry
    unratified_dependencies: [SA-U5, SA-U8]

  # ---------------------------------------------------------------- the cast
  cast:
    criterion: SS-3
    rule: Synthetic personas are isolated, and isolation is a property of the
      cast rather than of the run.
    checkable_half:
      - No two personas share a recovery selector.
      - No persona declares an edge to a selector outside the cast.
    enforced_by: tools/validate_cast.py
    uncheckable_half: The account-creation half is an operator act with no
      technical control available, and it is stated rather than mechanized.

  # ----------------------------------------------------------- credentials
  credentials:
    disjointness:
      criterion: SS-20
      rule: The account that looks and the account that is looked at are never
        the same account, and they are two separately provisioned populations.
      mechanism: a disjointness check, not a rule. No selector appears in both
        synthetic/CAST.md and the credential pool.
      refuses_on: any intersection, including a shared recovery selector
      enforced_by: tools/validate_authorization.py
      why_the_recovery_clause: A naive set comparison on handles alone misses a
        recovery selector shared between the two populations.
      runs_in: ISOLATED, because the credential pool never exists on LOCAL
    evidence_chain:
      criterion: SS-13
      rule: A credential used for collection is recorded in the authorization
        record's evidence_ref chain, so the question "whose account saw this" has
        an answer that is not a memory.
      unratified_dependencies: [SA-U11]
    quarantine:
      criterion: SS-13
      rule: quarantine_credential true requires a written exit criterion at the
        moment it is set.
      why: A quarantine with no exit criterion either lasts forever or ends when
        somebody notices, and neither is a decision.
    platform_side_record:
      criterion: SS-13
      rule: The platform's log of our collection is outside every mechanism in
        this repository, and the only control over it is not collecting.

  # --------------------------------------------------------------- findings
  findings:
    criterion: SS-18
    rule: Every finding carries the subject class it came from, and the scorer
      refuses to compute a figure across classes with a named violation rather
      than a warning.
    renders: on the finding itself, not in a tooltip and not two clicks away
    why: Against S3 and S4 recall is not computable and precision reduces to
      self-consistency, so a number produced over a mixed population is a
      different kind of statement wearing a measurement's clothes.
    fixture: conformance/ carries the refusal fixture.
    unratified_dependencies: [SA-U14]

  # -------------------------------------------------------------- injection
  injection:
    criterion: SS-21
    tag: An item whose collected value matches an injection signature is tagged
      at the extract boundary, inside the case. The tag is subject-derived and
      dies with the case.
    tag_also_does: It makes the analyst see the item and keeps SS-16 from
      treating the node as an ordinary pivot candidate.
    tag_stratum: not stated in doctrine. policy/retention.yaml's RT-2 check needs
      a stratum for the tag before it can refuse a subject-derived tag reaching a
      surviving stratum, and that assignment belongs to that file rather than
      this one.
    finding: The payload family is a finding and survives. SS-21's table puts it
      at stratum 3 and records that it carries no subject values.
    persistent_roster: refused. It is structurally the same object as a target
      package regardless of intent, and keeping one would require a deliberate
      ratified exception to RT-2 which SS-21 does not create.
    publication: undecided. AR-1 in doctrine/DOCTRINE_STATUS.md records the
      reading that publishing a roster would publish accusations this system
      cannot verify, and it awaits the operator. This file encodes neither a
      publication path nor a refusal that presumes AR-1 was accepted.

  # --------------------------------------------------- absolute prohibitions
  never:
    # SS-14. These refuse whatever any authorization file says, and they are
    # evaluated first for that reason. The list carries six items and it is not
    # six mechanisms, so each item states where it is actually enforced. Calling
    # an unbuilt item a mechanism is the laundering design gate 6 forbids, in the
    # list that reads as most enforced.
    criterion: SS-14
    evaluated: first, unconditionally
    fixture_is_built_on_an_item: true
    why_not_a_selector: No NEVER-listed selector exists or may exist. Section 7
      contains no selector values and names no file holding any, because a
      per-selector never-collect list would be a permanent register of real
      people's selectors in a tracked file, which SS-14 item 5 and RETENTION.md
      RT-15 forbid.
    fixture_items: [6, 1]
    items:
      - item: 1
        rule: No authentication as any account the team does not hold, and no
          impersonation of any person.
        permitted: Logging in with an S0 or S2 credential the team owns is a read
          and is permitted.
        refused: Using anyone else's credential, session, or identity, whatever
          the source of it.
        decision: R7, stamped
        enforced_by: A rule. Manifest check at Step 12 under R7.
        gate_evaluable: false
        mechanism_exists: false
      - item: 2
        rule: No collection against a person under 18, or against a selector
          whose available evidence indicates that.
        enforced_by: The analyst. The gate cannot verify age, and the text says
          so.
        gate_evaluable: false
        mechanism_exists: false
        why_it_is_here: Its absence would be read as permission, and its presence
          requires a run to stop when the analyst learns it rather than when a
          validator does.
      - item: 3
        rule: No action that mutates a target platform. No posting, messaging,
          following, or friend request. No profile view that the platform
          surfaces to the subject as an interaction.
        line: observability by the subject
        decision: R7, stamped
        enforced_by: A rule. interaction_class check at Step 12 under R7.
        gate_evaluable: false
        mechanism_exists: false
        stated_in_place: This is a rule that becomes a structure at Step 12 and
          it is not one yet.
      - item: 4
        rule: No model training and no fixture-building on non-synthetic data.
        why: A matcher trained or fixture-built on a real case carries that case
          in its weights or its fixtures permanently and cannot be shredded.
        enforced_by: A rule. No mechanism proposed at v0.1.
        gate_evaluable: false
        mechanism_exists: false
      - item: 5
        rule: No selector belonging to a natural person enters a tracked file,
          which includes worklog entries, commit messages, cassettes, and
          fixtures.
        why: Git history is the one store a crypto-shred cannot reach.
        enforced_by: .githooks/pre-commit, running
          tools/validate_retention.py --repo-scan. D-001, implemented at Step 8.
        gate_evaluable: false
        intended_code: FIXTURE_CONTAINS_LIVE_SELECTOR, named by SS-14 and not yet
          declared in the code vocabulary. Minting it is an edit to
          spec/layer-model.yaml and a regeneration, which this file does not do.
        out_of_reach: Issue text, chat transcripts, and anything outside the
          working tree are named in the rule and are outside what a pre-commit
          scan can reach at all. That half is a stated rule with no mechanism
          available and it says so rather than borrowing the scan's authority.
      - item: 6
        rule: No collection at all, including against a synthetic account, until
          every artifact in ratify_before_collection is stamped in
          doctrine/DOCTRINE_STATUS.md.
        enforced_by: The gate, reading doctrine/DOCTRINE_STATUS.md.
        gate_evaluable: true
        mechanism_exists: true
        unratified_dependencies: [SA-U15]

  ratify_before_collection:
    # SS-14 item 6's list, enumerated here because doctrine enumerates it rather
    # than incorporating it by reference. docs/THE-GAMEPLAN.md section 4 is its
    # provenance and holds the argument for each item; that file carries no rank,
    # declares itself unratified, and has an expiry condition. An absolute
    # prohibition whose content can change by editing an unranked document is not
    # absolute. Eight items across nine paths, which is the count
    # spec/pse-semantics-contract.md uses at rank 2. The gameplan's nine-row
    # table pairs two of these and adds a self-referential row for
    # DOCTRINE_STATUS.md that SS-14 does not name, and this list is not that one.
    source: doctrine/SUBJECT_SELECTION.md SS-14 item 6
    resolved_by_reference: false
    item_count: 8
    path_count: 9
    items:
      - id: 1
        paths: [doctrine/SUBJECT_SELECTION.md]
        granularity: per criterion
      - id: 2
        paths: [doctrine/RETENTION.md]
        granularity: per criterion
      - id: 3
        paths: [policy/subject-authorization.yaml,
          schema/subject-authorization.schema.json]
        granularity: per artifact, both together
      - id: 4
        paths: [policy/retention.yaml]
        granularity: per artifact
      - id: 5
        paths: [ontology/selectors.yaml]
        granularity: per artifact
      - id: 6
        paths: [spec/pse-semantics-contract.md]
        granularity: sections 5 and 12
      - id: 7
        paths: [synthetic/CAST.md]
        granularity: with a sealed, hash-pinned GROUND_TRUTH.yaml carrying at
          least one designed confuser pair
      - id: 8
        paths: [runner/dispatch_allowlist.yaml]
        granularity: per artifact
    preflight:
      # The one condition that is not a document and is therefore not stampable.
      # doctrine/DOCTRINE_STATUS.md records that it deliberately has no stamp row.
      stampable: false
      condition: preflight has passed in this runner process at startup
      failure: fatal to the runner rather than a warning
      checks:
        - tools/validate_authorization.py --dispatch-paths
        - tools/validate_authorization.py --fixtures
        - tools/validate_retention.py --policy --shred-roundtrip
        - tools/validate_retention.py --repo-scan
      make_target_is_not_the_enforcement: A make preflight target exists so CI
        can run the same set against fixtures. A mechanism whose only enforcement
        is a build target is enforced only against people who run build targets,
        and collection runs are started by people in a hurry.
    refuses: |-
      REFUSED
        where: the dispatch path, before argv and before a credential is drawn
        what:  SS-14 item 6 refuses all collection, including collection against
               a synthetic account, until all eight artifacts above carry a dated
               stamp in doctrine/DOCTRINE_STATUS.md and preflight has passed in
               this runner process. This is a hard refusal, so a present,
               complete, valid, unexpired authorization record does not unlock it
        moves: stamp the artifacts that are missing a row, in the pin of record,
               dated and with a ratifier; or run the four preflight checks and
               fix what they refuse; or collect nothing, which is what this
               refusal is holding

  # ------------------------------------------------------------- not gated
  not_gated:
    # Section 9 of the doctrine, carried so the policy does not over-refuse and
    # so nobody defers buildable work waiting for a permission it does not need.
    - The Run, Item and Claim spine, and the blob store.
    - PSE, its schemas, the selector registry, and the whole policy pack.
    - Every connector and manifest, both canaries, and the conformance ladder.
    - All six views, the Merge Sheet, clusters and exclusions, coverage intervals
      and the watchdog, the Lineage Drawer, and retroactive invalidation.
    - DRAFT and the export boundary.
    - The entire retention mechanism.
    - Complete end-to-end collection against S0, S1, S2, N0 and L0 nodes at any
      depth with no ceiling on aggressiveness, and against S3 and S4 once SS-17's
      baseline exists or is overridden.
    - Enumerating an organization or a location and building the web out of it,
      including alias and shell organizations and the people tied to them. What
      SS-16 gates is collecting against those people automatically, never listing
      them.

  single_operator_limit:
    criterion: SS-15
    rule: The operator is the ratifier, the maintainer, and the analyst. Every
      operator-approval gate in this policy is the operator approving their own
      request.
    mitigation: Writing it down. A control whose bypass is undocumented gets
      bypassed silently, and a control whose bypass is a dated Class F entry gets
      bypassed visibly.
    applies_most_directly_to: the SS-17 override

  rejected_readings:
    # Recorded so a settled question is not reopened by someone reading the same
    # evidence and reaching the same wrong conclusion.
    - reading: Retention alone bounds the harm of collection.
      why_rejected: Deleting a profile does not un-collect it, and the
        platform-side record of the collection is outside every mechanism in this
        repository. Subject selection is the upstream control.
      rejected_on: 2026-08-26
    - reading: The gate can infer a subject class from the selector value, so an
        authorization record is only needed for edge cases.
      why_rejected: Inferring a class means guessing whose account a handle is,
        using the same correlation machinery whose guesses are the thing under
        test. The gate reads a class that a person wrote down, or it refuses.
      rejected_on: 2026-08-26

  readings:
    # Interpretive calls this compilation had to make, on the
    # ontology/selectors.yaml precedent. Each names the sources in tension.
    # Confirming one is a stamp in doctrine/DOCTRINE_STATUS.md rather than an
    # edit here. A reading is not a gap: a gap is a question doctrine does not
    # answer, and these are questions doctrine answers indirectly.
    - id: SA-R1
      reading: This file is hand-authored rather than generated, and
        tools/validate_authorization.py is what refuses its drift from doctrine.
      sources: SS-14 item 6 stamps this path as an artifact in its own right, and
        spec/layer-model.yaml's subject_class comment names this file as the
        compiled source that the model mirrors. Generating it from the model
        would invert that relationship and make a Class F artifact the output of
        a Class C tool.
      change_class: B
    - id: SA-R2
      reading: The gate value enum is carried in the uppercase form already
        shipped at rank 3, with SS-7's lowercase recorded as the same three
        values.
      sources: SUBJECT_SELECTION.md disclaims field names and interface design,
        so the authority order sends the question to rank 3, where
        spec/layer-model.yaml already defines the three subtypes and the payload
        decision enum, generated into the schema and policy/lineage.yaml.
      change_class: B
    - id: SA-R3
      reading: Each evaluation step's return value is taken from the closed
        refusal_basis and extension_basis enums at rank 3, rather than invented
        here.
      sources: SS-8 attaches a value to step 1 only. spec/layer-model.yaml closes
        both basis enums, and SS-4, SS-7 and section 9 corroborate every
        assignment. SS-7 also records that the middle value stops the run, so
        both non-permitted values stop a run and neither assignment widens reach.
      change_class: B

  # -------------------------------------------------------------- unratified
  unratified:
    # Sixteen questions doctrine does not answer. Each one is a place where
    # writing a value here would decide who may be a subject, what a refusal
    # means, or how long collection may continue. None carries a default. A
    # mechanism that reaches one of these renders its refusal sentence and names
    # the entry, which is the designed state rather than an unfinished one.
    #
    # Shape, so a loader and tools/validate_authorization.py can read it: id,
    # change_class, question, options each with its cost, blocks, refuses, and
    # ratified_by. An entry is resolved when doctrine/DOCTRINE_STATUS.md carries
    # a dated row naming its id, at which point its content moves into the block
    # above that lists it under unratified_dependencies.
    ratified_by: a dated row in doctrine/DOCTRINE_STATUS.md naming the entry id,
      authored by the ratifier
    entries:
      - id: SA-U1
        change_class: F
        question: What consequence string does a REFUSED decision render when the
          basis is an expired, missing or incomplete record, or a missing
          baseline, given SS-7's refused row says "No authorization file unlocks
          it" and a corrected authorization file does unlock all four?
        options:
          - Per-basis consequence strings, which amends SS-7's table and needs
            the operator.
          - SS-7's literal string everywhere, which tells an analyst something
            untrue about their own expired record and is the laundering design
            gate 6 forbids.
          - Route expiry to REQUIRES_EXTENSION, which contradicts the shipped
            refusal_basis enum at rank 3.
        blocks: [the gate's rendering for steps 2 and 3, the expired fixture in
          conformance/gate/]
        refuses: |-
          REFUSED PENDING RATIFICATION
            where: policy/subject-authorization.yaml unratified SA-U1
            what:  the gate reached a REFUSED decision whose basis a corrected
                   authorization file would unlock, and the only rendering
                   doctrine supplies says no authorization file unlocks it.
                   Rendering that sentence here would state something untrue
                   about the analyst's own record
            moves: stamp one of the three options in doctrine/DOCTRINE_STATUS.md
                   and move the rendering into gate.values; or amend SS-7's table
                   at rank 1 so the refused row covers these bases honestly; or
                   leave the entry unstamped, in which case nothing dispatches
      - id: SA-U2
        change_class: F
        question: What does evidence_ref point at for S3, S4, N0 and L0, whose
          SS-1 evidence is a written statement and whose object is not among
          SS-4's three named kinds?
        options:
          - A fourth evidence kind, a written-statement record, stratum 1 inside
            the case boundary.
          - Inline the statement on the record for those four classes, making
            evidence_ref conditional and weakening SS-4's flat nine-field rule.
          - Hold until SS-4's evidence_ref row is amended the way its
            subject_class row was.
        blocks: [S3, S4, N0 and L0 authorization, schema/subject-authorization.schema.json]
        refuses: |-
          REFUSED PENDING RATIFICATION
            where: policy/subject-authorization.yaml unratified SA-U2
            what:  the record names a class whose evidence is a written statement
                   and SS-4's evidence_ref row names three objects, none of which
                   is one. The field has no legal value for four of the seven
                   authorizable classes, and choosing one here would decide what
                   evidence authorizes a third party
            moves: stamp one of the three options in doctrine/DOCTRINE_STATUS.md;
                   or authorize under S0, S1 or S2, whose evidence objects SS-4
                   names; or leave the entry unstamped and collect nothing
                   against S3, S4, N0 or L0
      - id: SA-U3
        change_class: F
        question: Is expires_on inclusive or exclusive, against which clock, and
          does the check re-run for a run already in flight?
        options:
          - UTC, evaluated at dispatch only.
          - UTC, re-evaluated per item, so a long subscription stops mid-run.
        note: Either answer is a choice about how long collection may continue,
          which is why it is the operator's.
        blocks: [gate evaluation step 2, the expired fixture in conformance/gate/]
        refuses: |-
          REFUSED PENDING RATIFICATION
            where: policy/subject-authorization.yaml unratified SA-U3
            what:  the gate was asked to compare expires_on against now and the
                   comparison is undefined. No clock, no inclusivity rule, and no
                   rule for a run already in flight. SS-5 requires a fixture that
                   makes this field refuse, and a field compared by an undefined
                   rule is the defect SS-5 exists to prevent
            moves: stamp one of the two options in doctrine/DOCTRINE_STATUS.md
                   and move it into record.required_fields; or dispatch nothing,
                   which is what this refusal is holding
      - id: SA-U4
        change_class: F
        question: Does expiry of the authorization record trigger the case shred,
          and how does expires_on relate to retain_until in policy/retention.yaml?
          If the two differ, which governs?
        options:
          - Independent. A case can hold material it may no longer collect on,
            out to the retention ceiling.
          - Coupled. expires_on caps retain_until and expiry enters the shred
            queue.
          - The shorter of the two governs both.
        blocks: [policy/retention.yaml, the shred queue, the case close path]
        refuses: |-
          REFUSED PENDING RATIFICATION
            where: policy/subject-authorization.yaml unratified SA-U4
            what:  a record expired and the case still holds its material. Which
                   of expires_on and retain_until governs the material is
                   undecided, so neither the sweep nor the gate can act on the
                   expiry without deciding how long a person's data lives
            moves: stamp one of the three options in doctrine/DOCTRINE_STATUS.md
                   and land it in both this file and policy/retention.yaml in the
                   same commit; or close the case by hand and shred it, which is
                   always legal; or leave the entry unstamped and open no case
      - id: SA-U5
        change_class: F
        question: When the S1 consent record's own expiry and the authorization
          record's expires_on disagree, which binds, and is a mismatch refused at
          schema validation?
        options:
          - The shorter binds, with both recorded.
          - The consent expiry binds and a mismatch refuses at schema validation.
          - expires_on binds and the consent expiry is documentation, which lets
            an expired consent sit behind a live authorization.
        blocks: [S1 collection, schema/subject-authorization.schema.json]
        refuses: |-
          REFUSED PENDING RATIFICATION
            where: policy/subject-authorization.yaml unratified SA-U5
            what:  an S1 record carries two expiry dates that disagree, and
                   nothing decides which one ends the collection. SS-2 refuses a
                   consent record with no expiry rather than defaulting one,
                   because a default written by the system is the system
                   consenting on the subject's behalf, and picking the later date
                   here would be the same act
            moves: stamp one of the three options in doctrine/DOCTRINE_STATUS.md;
                   or re-record the consent and the authorization with one date;
                   or leave the entry unstamped and collect nothing under S1
      - id: SA-U6
        change_class: F
        question: What object satisfies SS-17's baseline scorecard, where does it
          live, and does it go stale?
        options:
          - A scorecard registry path plus a minimal required-field set named in
            this policy.
          - A stamped row in doctrine/DOCTRINE_STATUS.md asserting that a
            baseline exists, which substitutes the operator's assertion for
            evidence.
        note: Per-connector scoping is foreclosed by SS-17's words "at least
          one". Staleness is the open half.
        blocks: [S3 and S4 collection, the SS-8 step 3 matched pair in conformance/gate/]
        refuses: |-
          REFUSED PENDING RATIFICATION
            where: policy/subject-authorization.yaml unratified SA-U6
            what:  gate step 3 was asked whether a baseline scorecard exists and
                   there is no object to look for. SS-17 makes the baseline a
