  event_types:
    AUTHORIZE_EVENT:
      layer: authorization
      discriminator: payload.act
      subtypes:
      - GRANT
      - EXTEND
      - REVOKE
      required:
        GRANT:
        - act
        - authorization_ref
        - subject_class
        - expires_on
        - pivot_depth_max
        - authorized_by
        - purpose_hash
        EXTEND:
        - act
        - authorization_ref
        - subject_class
        - expires_on
        - pivot_depth_max
        - authorized_by
        - purpose_hash
        - reason
        REVOKE:
        - act
        - authorization_ref
        - authorized_by
        - reason
      allowed:
        GRANT:
        - act
        - authorization_ref
        - subject_class
        - expires_on
        - pivot_depth_max
        - authorized_by
        - purpose_hash
        - reason
        EXTEND:
        - act
        - authorization_ref
        - subject_class
        - expires_on
        - pivot_depth_max
        - authorized_by
        - purpose_hash
        - reason
        REVOKE:
        - act
        - authorization_ref
        - authorized_by
        - reason
      payload_must_not_contain:
      - names:
        - selectors
        - selector
        - evidence_ref
        - purpose
        - value
        - content
        - raw
        code: AUTHORIZATION_RECORD_INLINED
        why: SS-4's record carries the exact seed selectors and, for S1, a named person. Inlining any
          of it moves stratum-1 material into a stratum-2 event that survives the shred (RT-2).
      - names:
        - cluster_id
        - members
        code: LAYER_FIELD_ABOVE_LAYER
        why: The authorization layer has no identity.
      - names:
        - confidence
        code: CONFIDENCE_PROHIBITED
        why: LAYER_FIELD_ABOVE_LAYER fires only where no narrower code names the field, and CONFIDENCE_PROHIBITED
          is the narrower code this type declares.
      - names:
        - sessionid
        - session_id
        - cookie
        - token
        - password
        - secret
        - argv
        - command
        - credential
        - credential_value
        code: CREDENTIAL_VALUE_IN_PAYLOAD
        why: CREDENTIAL_LIFECYCLE.md CR-3. The argv family is here on every type because the code's own
          declaration covers every payload and an earlier draft prohibited these four on PROBE_EVENT alone,
          which left eight of the nine types generating a schema branch that accepts a filled argv.
      confidence:
        rule: prohibited
        code: CONFIDENCE_PROHIBITED
      rules:
      - name: purpose_bound
        code: CASE_PURPOSE_UNBOUND
        when:
          subtype: GRANT
        requires:
        - purpose_hash
        cites:
        - doctrine/SUBJECT_SELECTION.md SS-4
        statement: A GRANT carries purpose_hash. A case with no purpose has no authorization.
      - name: reason_names_no_subject
        code: REASON_NAMES_SUBJECT
        when:
          field: reason
          present: true
        requires: []
        cites:
        - doctrine/RETENTION.md RT-2
        - doctrine/SUBJECT_SELECTION.md SS-4
        statement: reason states why the act was taken without naming or describing the subject. This
          payload is stratum 2 and survives the shred, so a sentence that describes a person puts subject-derived
          material in a surviving object, which RT-2 calls a defect rather than a judgment call.
      runtime_rules: []
      rendering_rules: []
      registry_fields: []
      retention:
        envelope_stratum: 2
        payload_stratum: 2
        carries_subject_values: false
      egress:
        envelope_crosses_to_local: true
        payload_crosses_to_local: true
    COLLECT_EVENT:
      layer: authorization
      discriminator: payload.decision
      subtypes:
      - PERMITTED
      - REQUIRES_EXTENSION
      - REFUSED
      required:
        PERMITTED:
        - decision
        - authorization_ref
        - connector_id
        - target_selector_type
        - subject_relation
        - pivot_depth
        - decided_at_step
        - incidental_estimate
        - bystander_disposition
        REQUIRES_EXTENSION:
        - decision
        - authorization_ref
        - connector_id
        - target_selector_type
        - subject_relation
        - pivot_depth
        - decided_at_step
        - extension_basis
        REFUSED:
        - decision
        - connector_id
        - target_selector_type
        - decided_at_step
        - refusal_basis
      allowed:
        PERMITTED:
        - decision
        - authorization_ref
        - connector_id
        - target_selector_type
        - subject_relation
        - pivot_depth
        - decided_at_step
        - incidental_estimate
        - bystander_disposition
        - motivated_by
        - incidental_estimate_reason
        - never_item
        REQUIRES_EXTENSION:
        - decision
        - authorization_ref
        - connector_id
        - target_selector_type
        - subject_relation
        - pivot_depth
        - decided_at_step
        - extension_basis
        - motivated_by
        - incidental_estimate_reason
        - never_item
        - incidental_estimate
        REFUSED:
        - decision
        - connector_id
        - target_selector_type
        - decided_at_step
        - refusal_basis
        - motivated_by
        - incidental_estimate_reason
        - never_item
        - incidental_estimate
      payload_must_not_contain:
      - names:
        - value
        - selector_value
        - content
        - raw
        - items
        - claims
        - body
        - text
        code: COLLECT_HAS_CONTENT
        why: SS-19. The gate reads the authorization record and the chain, never collected content, and
          its record carries none either.
      - names:
        - purpose
        - evidence_ref
        code: AUTHORIZATION_RECORD_INLINED
        why: This event references the SS-4 record through authorization_ref, and the record carries the
          exact seed selectors and, for S1, a named person. The reasoning that put these two on AUTHORIZE_EVENT
          applies unchanged to every stratum-2 event that references the same record (RT-2).
      - names:
        - selectors
        - cluster_id
        - members
        code: LAYER_FIELD_ABOVE_LAYER
        why: The gate decides on a selector type and a chain, not on identity.
      - names:
        - confidence
        code: CONFIDENCE_PROHIBITED
        why: LAYER_FIELD_ABOVE_LAYER fires only where no narrower code names the field, and CONFIDENCE_PROHIBITED
          is the narrower code this type declares.
      - names:
        - sessionid
        - session_id
        - cookie
        - token
        - password
        - secret
        - argv
        - command
        - credential
        - credential_value
        code: CREDENTIAL_VALUE_IN_PAYLOAD
        why: CREDENTIAL_LIFECYCLE.md CR-3. The gate runs before a credential is drawn (SS-6), and it constructs
          no argv, so neither family has a legitimate place here.
      confidence:
        rule: prohibited
        code: CONFIDENCE_PROHIBITED
      rules:
      - name: disposition_in_set
        code: BYSTANDER_DISPOSITION_OUT_OF_SET
        when:
          subtype: PERMITTED
        requires:
        - bystander_disposition
        cites:
        - doctrine/SUBJECT_SELECTION.md SS-10
        statement: bystander_disposition is count_only or refuse. Any other value refuses.
      - name: purpose_bound
        code: CASE_PURPOSE_UNBOUND
        when:
          subtype: PERMITTED
        requires:
        - authorization_ref
        cites:
        - doctrine/SUBJECT_SELECTION.md SS-4
        - docs/THE-GAMEPLAN.md section 2.3 fixture 14
        statement: A PERMITTED decision resolves authorization_ref to a GRANT carrying purpose_hash.
      runtime_rules:
      - name: incidental_estimate_present
        code: INCIDENTAL_ESTIMATE_MISSING
        when: runtime
        requires:
        - incidental_estimate
        cites:
        - doctrine/SUBJECT_SELECTION.md SS-12
        statement: A PERMITTED decision for a connector that reaches beyond its named selector carries
          incidental_estimate as an integer, or unestimable with incidental_estimate_reason. Absent or
          blank is a refusal.
        runtime_reason: Whether a connector reaches beyond its named selector is a fact about its manifest,
          not a field on this event, so the wire schema cannot carry the condition. The gate evaluates
          it against the manifest at dispatch.
      rendering_rules:
      - name: refusal_rendered_as_consequence
        when:
          subtype:
          - REQUIRES_EXTENSION
          - REFUSED
        requires: []
        cites:
        - doctrine/SUBJECT_SELECTION.md SS-7
        - CLAUDE.md section 4
        statement: REQUIRES_EXTENSION and REFUSED render as their consequence, never as the token (SS-7
          table). This is a rendering rule the generator carries into the UI slot declarations, not a
          wire check.
      registry_fields:
      - target_selector_type
      retention:
        envelope_stratum: 2
        payload_stratum: 2
        carries_subject_values: false
      egress:
        envelope_crosses_to_local: true
        payload_crosses_to_local: true
    PROBE_EVENT:
      layer: observation
      discriminator: payload.phase
      subtypes:
      - RUN_START
      - ITEM
      - RUN_END
      required:
        RUN_START:
        - phase
        - run_id
        - connector_id
        - connector_version
        - connector_kind
        - credential_id
        - egress
        - argv_template
        - motivated_by
        - target_selector_type
        - manifest_hash
        ITEM:
        - phase
        - run_id
        - item_id
        - locator
        - outcome
        - raw_ref
        RUN_END:
        - phase
        - run_id
        - exit_code
        - error_class
        - item_count
        - duration_ms
      allowed:
        RUN_START:
        - phase
        - run_id
        - connector_id
        - connector_version
        - connector_kind
        - credential_id
        - egress
        - argv_template
        - motivated_by
        - target_selector_type
        - manifest_hash
        - target_ref
        - method_id
        - negative_class
        - retry_after_s
        - http_status_chain
        - raw_blob_sha256
        ITEM:
        - phase
        - run_id
        - item_id
        - locator
        - outcome
        - raw_ref
        - target_ref
        - method_id
        - negative_class
        - retry_after_s
        - http_status_chain
        - raw_blob_sha256
        RUN_END:
        - phase
        - run_id
        - exit_code
        - error_class
        - item_count
        - duration_ms
        - target_ref
        - method_id
        - negative_class
        - retry_after_s
        - http_status_chain
        - raw_blob_sha256
      payload_must_not_contain:
      - names:
        - argv
        - command
        - credential
        - credential_value
        code: CREDENTIAL_VALUE_IN_PAYLOAD
        why: The filled argv carries the credential when a tool takes it as a flag (the measured toutatis
          defect, CR-3), and carries the selector value, which would put stratum-1 material in a stratum-2
          RUN_START (RT-2). Every type prohibits these four; this group keeps its own entry because PROBE_EVENT
          is the type where the defect was measured and the reason is worth reading here.
      - names:
        - sessionid
        - session_id
        - cookie
        - token
        - password
        - secret
        code: CREDENTIAL_VALUE_IN_PAYLOAD
        why: CREDENTIAL_LIFECYCLE.md CR-3.
      - names:
        - raw
        - raw_bytes
        - stdout
        - stderr
        - body
        - response
        code: OBSERVATION_HAS_INLINE_RAW
        why: Raw capture is stratum 0, addressed by sha256 through raw_ref. Inline bytes make the raw
          blob unenumerable and the shred unverifiable (RT-9).
      - names:
        - selector_type
        - value
        - claims
        - proposes
        code: OBSERVATION_HAS_CLAIM
        why: An ITEM is a locator plus an outcome. A field asserted by an item is an EXTRACT_EVENT, and
          folding it in collapses Run, Item, Claim to Run, Claim (docs/PLAINSIGHT-design.md section 2.1).
      - names:
        - cluster_id
        - members
        - accepted
        - band
        - rationale_codes
        code: OBSERVATION_HAS_IDENTITY
        why: Observation never carries identity.
      - names:
        - confidence
        code: CONFIDENCE_PROHIBITED
        why: See `confidence`.
      - names:
        - review_state
        code: EXTRACT_HAS_REVIEW_STATE
        why: D3. Adjudication is an appended event.
      confidence:
        rule: prohibited
        code: CONFIDENCE_PROHIBITED
      rules:
      - name: environment_is_isolated
        code: EGRESS_ENVIRONMENT_REFUSED
        when:
          subtype: RUN_START
        requires:
        - egress
        cites:
        - doctrine/EGRESS.md EG-6
        - doctrine/EGRESS.md EG-1
        statement: RUN_START carries egress.environment ISOLATED and source.environment ISOLATED. A run
          from LOCAL is refused.
      - name: run_permitted
        code: SUBJECT_NOT_AUTHORIZED
        when:
          subtype: RUN_START
        requires: []
        cites:
        - doctrine/SUBJECT_SELECTION.md SS-6
        - docs/PLAINSIGHT-FOUNDATION.md D5
        statement: RUN_START resolves a COLLECT_EVENT PERMITTED parent in lineage. Without it the run
          was never gated.
      - name: run_matches_its_decision
        code: SUBJECT_NOT_AUTHORIZED
        when:
          subtype: RUN_START
        requires:
        - connector_id
        - target_selector_type
        - motivated_by
        cites:
        - doctrine/SUBJECT_SELECTION.md SS-5
        - doctrine/SUBJECT_SELECTION.md SS-6
        - doctrine/SUBJECT_SELECTION.md SS-8
        - docs/PLAINSIGHT-FOUNDATION.md D5
        statement: RUN_START's connector_id, target_selector_type and motivated_by equal those of the
          COLLECT_EVENT PERMITTED it names in lineage.based_on. A run whose fields differ from its decision's
          is a dispatch the gate never evaluated, even though a PERMITTED resolves in lineage. Without
          this rule, one PERMITTED authorizes any number of runs against selectors and connectors it never
          saw, which is the shape SS-5 records as a field declared, listed, printed, and never read by
          check().
        open_reading: LM-R10
      runtime_rules: []
      rendering_rules: []
      registry_fields:
      - target_selector_type
      retention:
        envelope_stratum: 2
        payload_stratum:
          RUN_START: 2
          ITEM: 1
          RUN_END: 2
        carries_subject_values:
          RUN_START: false
          ITEM: true
          RUN_END: false
      egress:
        envelope_crosses_to_local: true
        payload_crosses_to_local:
          RUN_START: true
          ITEM: false
          RUN_END: true
    EXTRACT_EVENT:
      layer: observation
      discriminator: payload.extract_kind
      subtypes:
      - CLAIM
      required:
        CLAIM:
        - extract_kind
        - selector_type
        - value
        - source_ref
        - extractor
        - temporal
        - negative_state
      allowed:
        CLAIM:
        - extract_kind
        - selector_type
        - value
        - source_ref
        - extractor
        - temporal
        - negative_state
        - subject_ref
        - injection_tagged
        - injection_family
      payload_must_not_contain:
      - names:
        - confidence
        code: EXTRACT_HAS_CONFIDENCE
        why: An observation with a confidence is a guess wearing a number (CLAUDE.md gate 6, design section
          5.1).
      - names:
        - review_state
        - verified
        - disputed
        - verified_by
        code: EXTRACT_HAS_REVIEW_STATE
        why: D3. Adjudication is an appended ADJUDICATE_EVENT, never a column.
      - names:
        - cluster_id
        - members
        - proposes
        - accepted
        - band
        - rationale_codes
        code: OBSERVATION_HAS_IDENTITY
        why: Observation never carries identity.
      - names:
        - link_type
        - model
        code: OBSERVATION_HAS_INFERENCE
        why: A claim is not a proposal. A matcher's output is a LINK_EVENT.
      - names:
        - sessionid
        - session_id
        - cookie
        - token
        - password
        - secret
        - argv
        - command
        - credential
        - credential_value
        code: CREDENTIAL_VALUE_IN_PAYLOAD
        why: CREDENTIAL_LIFECYCLE.md CR-3. The argv family is here on every type because the code's own
          declaration covers every payload and an earlier draft prohibited these four on PROBE_EVENT alone,
          which left eight of the nine types generating a schema branch that accepts a filled argv.
      confidence:
        rule: prohibited
        code: EXTRACT_HAS_CONFIDENCE
      rules:
      - name: selector_type_registered
        code: SELECTOR_TYPE_UNREGISTERED
        when:
          subtype: CLAIM
        requires:
        - selector_type
        cites:
        - docs/PLAINSIGHT-FOUNDATION.md D2
        - docs/THE-GAMEPLAN.md section 2.3 fixture 10
        statement: selector_type is a key in ontology/selectors.yaml. The vocabulary is closed at the
          corpus boundary, not only at the manifest.
      - name: absence_requires_canary
        code: ABSENCE_CLAIMED_WITHOUT_CANARY
        when:
          field: negative_state
          equals: attempted_and_absent
        requires: []
        cites:
        - docs/PLAINSIGHT-design.md section 5.2
        - docs/PLAINSIGHT-design.md section 8.4
        statement: negative_state attempted_and_absent is refused for a field whose always_present is
          not proven by the connector's known_positive canary. Otherwise an over-optimistic emits list
          manufactures negative evidence from a YAML typo.
      - name: temporal_never_repaired
        code: ENUM_VALUE_INVALID
        when:
          subtype: CLAIM
        requires:
        - temporal
        cites:
        - docs/PLAINSIGHT-design.md section 2.2
        statement: time_provenance absent is legal and asserted_at null is legal. A producer that fills
          asserted_at from observed_at has repaired a corrupt datum, and the corpus carries a fixture
          for it.
      runtime_rules: []
      rendering_rules: []
      registry_fields:
      - selector_type
      retention:
        envelope_stratum: 2
        payload_stratum: 1
        carries_subject_values: true
      egress:
        envelope_crosses_to_local: true
        payload_crosses_to_local: false
    LINK_EVENT:
      layer: inference
      discriminator: payload.link_type
      subtypes:
      - SAME_ENTITY
      - ASSOCIATED_WITH
      - CO_LOCATED
      - CONTROLS
      required:
        SAME_ENTITY:
        - link_type
        - claim
        - model
        - based_on
        - accepted
        ASSOCIATED_WITH:
        - link_type
        - claim
        - model
        - based_on
        - accepted
        CO_LOCATED:
        - link_type
        - claim
        - model
        - based_on
        - accepted
        CONTROLS:
        - link_type
        - claim
        - model
        - based_on
        - accepted
      allowed:
        SAME_ENTITY:
        - link_type
        - claim
        - model
        - based_on
        - accepted
        ASSOCIATED_WITH:
        - link_type
        - claim
        - model
        - based_on
        - accepted
        CO_LOCATED:
        - link_type
        - claim
        - model
        - based_on
        - accepted
        CONTROLS:
        - link_type
        - claim
        - model
        - based_on
        - accepted
      payload_must_not_contain:
      - names:
        - cluster_id
        - members
        - asserted_by
        - band
        - rationale_codes
        - member_seams
        code: INFERENCE_HAS_FUSION_STATE
        why: A proposal that names a cluster has skipped the human act that creates one.
      - names:
        - accepted_at
        - accepted_by
        - review_state
        code: LINK_HAS_ACCEPTANCE
        why: Acceptance is a separate human act.
      - names:
        - confidence
        - score
        - probability
        code: CONFIDENCE_PROHIBITED
        why: LM-R2. See `confidence`.
      - names:
        - sessionid
        - session_id
        - cookie
        - token
        - password
        - secret
        - argv
        - command
        - credential
        - credential_value
        code: CREDENTIAL_VALUE_IN_PAYLOAD
        why: CREDENTIAL_LIFECYCLE.md CR-3. The argv family is here on every type because the code's own
          declaration covers every payload and an earlier draft prohibited these four on PROBE_EVENT alone,
          which left eight of the nine types generating a schema branch that accepts a filled argv.
      confidence:
        rule: prohibited
        code: CONFIDENCE_PROHIBITED
      rules:
      - name: accepted_const_false
        code: LINK_HAS_ACCEPTANCE
        when: always
        requires:
        - accepted
        cites:
        - docs/PLAINSIGHT-design.md section 8.2
        - docs/PLAINSIGHT-FOUNDATION.md section 4.2
        statement: accepted is present and false. A LINK arriving with accepted true is refused (fixture
          12).
      runtime_rules: []
      rendering_rules: []
      registry_fields: []
      retention:
        envelope_stratum: 2
        payload_stratum: 1
        carries_subject_values: true
      egress:
        envelope_crosses_to_local: true
        payload_crosses_to_local: false
    IDENTITY_EVENT:
      layer: fusion
      discriminator: payload.assertion
      subtypes:
      - CLUSTER
      - EXCLUDE
      required:
        CLUSTER:
        - assertion
        - cluster_id
        - members
        - asserted_by
        - rationale_codes
        - band
        - last_supporting_ts
        - member_seams
        - basis_claims
        EXCLUDE:
        - assertion
        - candidate_ref
        - asserted_by
        - basis
      allowed:
        CLUSTER:
        - assertion
        - cluster_id
        - members
        - asserted_by
        - rationale_codes
        - band
        - last_supporting_ts
        - member_seams
        - basis_claims
        - hypothesis_set
        - circularity_override
        - subject_ref
        - note
        EXCLUDE:
        - assertion
        - candidate_ref
        - asserted_by
        - basis
        - hypothesis_set
        - circularity_override
        - subject_ref
        - rationale_codes
        - band
        - note
      payload_must_not_contain:
      - names:
        - confidence
        - rollup
        - weakest_seam
        - score
        - probability
        code: CLUSTER_HAS_ROLLUP_CONFIDENCE
        why: A strong pair plus a doubtful third is not a weak cluster, and a rollup hides which member
          is the problem (design section 8.4).
      - names:
        - raw
        - value
        - source_path
        - raw_span
        - features
        code: RAW_ABOVE_OBSERVATION
        why: Fusion references claims by id and never re-carries their content.
      - names:
        - model
        - accepted
        - link_type
        - review_state
        code: FUSION_HAS_INFERENCE_FIELDS
        why: A human assertion wearing a matcher's fields is a matcher output laundered into fusion.
      - names:
        - sessionid
        - session_id
        - cookie
        - token
        - password
        - secret
        - argv
        - command
        - credential
        - credential_value
        code: CREDENTIAL_VALUE_IN_PAYLOAD
        why: CREDENTIAL_LIFECYCLE.md CR-3. The argv family is here on every type because the code's own
          declaration covers every payload and an earlier draft prohibited these four on PROBE_EVENT alone,
          which left eight of the nine types generating a schema branch that accepts a filled argv.
      confidence:
        rule: prohibited
        code: CLUSTER_HAS_ROLLUP_CONFIDENCE
      rules:
      - name: members_min_two
        code: CLUSTER_MEMBERS_INSUFFICIENT
        when:
          subtype: CLUSTER
        requires:
        - members
        cites:
        - docs/PLAINSIGHT-FOUNDATION.md section 4.2
        statement: A CLUSTER has at least two members. One account is not an identity assertion.
      - name: rationale_present
        code: RATIONALE_MISSING
        when:
          subtype: CLUSTER
        requires:
        - rationale_codes
        - member_seams
        cites:
        - docs/PLAINSIGHT-design.md section 5.5
        - docs/PLAINSIGHT-design.md section 8.2
        statement: rationale_codes has at least one code, and member_seams names at least one code per
          member.
      - name: external_knowledge_needs_note
        code: RATIONALE_NOTE_MISSING
        when:
          field: rationale_codes
          contains: k
        requires:
        - note
        cites:
        - docs/PLAINSIGHT-design.md section 5.5
        statement: rationale_codes containing k requires note. g does not, at merge time; the note is
          required at the export boundary instead.
      - name: almost_certain_needs_two_classes
        code: BAND_UNSUPPORTED
        when:
          field: band
          equals: almost_certain
        requires: []
        cites:
        - docs/PLAINSIGHT-design.md section 5.5
        statement: band almost_certain requires rationale_codes drawn from at least two distinct evidence_classes.
          Two string matches do not qualify.
      - name: circularity
        code: MERGE_CIRCULAR
        when:
          subtype: CLUSTER
        requires: []
        cites:
        - docs/PLAINSIGHT-design.md section 5.5
        - docs/PLAINSIGHT-design.md section 4.6
        statement: Refused when any basis claim's selector traces to a GENERATED origin, or to an observation
          produced by pivoting on a value emitted by one of the members, unless circularity_override carries
          a note. The walk is over lineage, which is why lineage is required here.
      runtime_rules: []
      rendering_rules: []
      registry_fields: []
      retention:
        envelope_stratum: 2
        payload_stratum: 1
        carries_subject_values: true
      egress:
        envelope_crosses_to_local: true
        payload_crosses_to_local: false
      evidence_classes:
        string:
        - h
        - e
        - n
        content:
        - b
        image:
        - i
        temporal:
        - t
        judgment:
        - g
        - k
    ADJUDICATE_EVENT:
      layer: adjudication
      discriminator: payload.disposition
      subtypes:
      - VERIFY
      - DISPUTE
      - PROMOTE
      - IGNORE
      - REVOKE
      - ACKNOWLEDGE
      - OVERRIDE
      - NOTE
      - QUESTION
      required:
        VERIFY:
        - disposition
        - target_ref
        - analyst
        - in_course_of
        DISPUTE:
        - disposition
        - target_ref
        - analyst
        - reason
        PROMOTE:
        - disposition
        - target_ref
        - analyst
        - promotion_kind
        IGNORE:
        - disposition
        - target_ref
        - analyst
        REVOKE:
        - disposition
        - target_ref
        - analyst
        - reason
        ACKNOWLEDGE:
        - disposition
        - target_ref
        - analyst
        - note
        OVERRIDE:
        - disposition
        - target_ref
        - analyst
        - override_kind
        - note
        NOTE:
        - disposition
        - target_ref
        - analyst
        - text
        QUESTION:
        - disposition
        - target_ref
        - analyst
        - text
      allowed:
        VERIFY:
        - disposition
        - target_ref
        - analyst
        - in_course_of
        - entity_id
        - anchor_claim_ref
        - reason
        DISPUTE:
        - disposition
        - target_ref
        - analyst
        - reason
        - entity_id
        - anchor_claim_ref
        PROMOTE:
        - disposition
        - target_ref
        - analyst
        - promotion_kind
        - entity_id
        - anchor_claim_ref
        - entity_type
        - anchor_selector_type
        - reason
        IGNORE:
        - disposition
        - target_ref
        - analyst
        - entity_id
        - anchor_claim_ref
        - reason
        REVOKE:
        - disposition
        - target_ref
        - analyst
        - reason
        - entity_id
        - anchor_claim_ref
        ACKNOWLEDGE:
        - disposition
        - target_ref
        - analyst
        - note
        - entity_id
        - anchor_claim_ref
        - reason
        OVERRIDE:
        - disposition
        - target_ref
        - analyst
        - override_kind
        - note
        - entity_id
        - anchor_claim_ref
        - reason
        NOTE:
        - disposition
        - target_ref
        - analyst
        - text
        - entity_id
        - anchor_claim_ref
        - reason
        QUESTION:
        - disposition
        - target_ref
        - analyst
        - text
        - entity_id
        - anchor_claim_ref
        - reason
      payload_must_not_contain:
      - names:
        - value
        - raw
        - source_path
        - raw_span
        - features
        code: RAW_ABOVE_OBSERVATION
        why: An adjudication references the object and never re-carries its content.
      - names:
        - members
        - cluster_id
        - band
        - rationale_codes
        code: LAYER_FIELD_ABOVE_LAYER
        why: An adjudication is not an identity assertion. Asserting identity is IDENTITY_EVENT.
      - names:
        - confidence
        code: CONFIDENCE_PROHIBITED
        why: An adjudication is a human act, and a number attached to it is a guess wearing a costume
          (CLAUDE.md gate 6).
      - names:
        - review_state
        code: EXTRACT_HAS_REVIEW_STATE
        why: review_state here would be the column D3 removed, reintroduced one layer up. That is the
          review-state defect and not a confidence defect, so it fires the code whose declaration names
          it. The two shared a group until 2026-09-03, which meant one name fired a code that excludes
          it and no must-fail fixture for either could set expect_only.
      - names:
        - sessionid
        - session_id
        - cookie
        - token
        - password
        - secret
        - argv
        - command
        - credential
        - credential_value
        code: CREDENTIAL_VALUE_IN_PAYLOAD
        why: CREDENTIAL_LIFECYCLE.md CR-3. The argv family is here on every type because the code's own
          declaration covers every payload and an earlier draft prohibited these four on PROBE_EVENT alone,
          which left eight of the nine types generating a schema branch that accepts a filled argv.
      confidence:
        rule: prohibited
        code: CONFIDENCE_PROHIBITED
      rules:
      - name: anchor_selector_may_anchor
        code: SELECTOR_ANCHOR_PROHIBITED
        when:
          all_of:
          - subtype: PROMOTE
          - field: promotion_kind
            equals: item_to_entity
          - field: entity_type
            equals: Account
        requires:
        - anchor_selector_type
        cites:
        - docs/PLAINSIGHT-design.md section 2.2
        - docs/THE-GAMEPLAN.md section 2.3 fixture 3
        statement: PROMOTE with promotion_kind item_to_entity and entity_type Account carries anchor_selector_type
          whose registry entry has may_anchor_entity true. An Account anchored on a handle renders a handle-owner
          change as ordinary drift when it is an identity catastrophe.
      - name: target_matches_disposition
        code: LINEAGE_PARENT_TYPE_INVALID
        when: always
        requires: []
        cites:
        - docs/PLAINSIGHT-FOUNDATION.md D3
        statement: The lineage parent's type is in the disposition's allowed target set under lineage.allowed_targets.
          Verifying a cluster or revoking a claim is a category error.
      runtime_rules:
      - name: reason_when_load_bearing
        code: ADJUDICATION_REASON_MISSING
        when: runtime
        requires:
        - reason
        cites:
        - docs/PLAINSIGHT-design.md section 4.4
        - docs/PLAINSIGHT-design.md section 5.6
        statement: IGNORE requires reason when the target supports a live cluster or was promoted by another
          analyst. DISPUTE and REVOKE always require it. The conditional half is a runtime check against
          the case, stated here so the generator emits it.
        runtime_reason: Whether the target supports a live cluster, or was promoted by another analyst,
          is a fact about the case rather than a field on this event. DISPUTE and REVOKE carry reason
          in payload.required, so only the IGNORE half is conditional.
      rendering_rules: []
      registry_fields:
      - anchor_selector_type
      retention:
        envelope_stratum: 2
        payload_stratum: 1
        carries_subject_values: true
      egress:
        envelope_crosses_to_local: true
        payload_crosses_to_local: false
    ASSESS_EVENT:
      layer: state
      discriminator: payload.assessment_kind
      subtypes:
      - SENTENCE
      required:
        SENTENCE:
        - assessment_kind
        - subject_ref
        - subject_class
        - text
        - citations
        - author
      allowed:
        SENTENCE:
        - assessment_kind
        - subject_ref
        - subject_class
        - text
        - citations
        - author
        - geo
        - paragraph_ref
      payload_must_not_contain:
      - names:
        - raw
        - features
        - measurement
        - source_path
        - raw_span
        - credential_ref
        - value
        code: RAW_ABOVE_OBSERVATION
        why: zmeta-spec contract 7.7's raw-artifact denylist, kept. A projection is complete in citations
          and minimized in content or it has passed half a gate (CLAUDE.md gate 7).
      - names:
        - members
        - cluster_id
        code: LAYER_FIELD_ABOVE_LAYER
        why: An assessment cites a cluster by ref. Carrying its membership inline is a fusion object copied
          into state.
      - names:
        - confidence
        - score
        - probability
        code: CONFIDENCE_PROHIBITED
        why: See `confidence`.
      - names:
        - sessionid
        - session_id
        - cookie
        - token
        - password
        - secret
        - argv
        - command
        - credential
        - credential_value
        code: CREDENTIAL_VALUE_IN_PAYLOAD
        why: CREDENTIAL_LIFECYCLE.md CR-3. The argv family is here on every type because the code's own
          declaration covers every payload and an earlier draft prohibited these four on PROBE_EVENT alone,
          which left eight of the nine types generating a schema branch that accepts a filled argv.
      confidence:
        rule: prohibited
        code: CONFIDENCE_PROHIBITED
      rules:
      - name: subject_class_present
        code: SUBJECT_CLASS_MISSING
        when: always
        requires:
        - subject_class
        cites:
        - doctrine/SUBJECT_SELECTION.md SS-1
        - doctrine/SUBJECT_SELECTION.md SS-18
        statement: subject_class is present and in SS-1's authorizable set, which is SS-1's classes minus
          S5. The scorer refuses a scorecard whose inputs span classes.
      - name: citation_present
        code: CITATION_MISSING
        when: always
        requires:
        - citations
        cites:
        - docs/PLAINSIGHT-design.md section 5.7
        statement: citations has at least one entry and every ref resolves in lineage.based_on.
      - name: cited_as_matches_selector_type
        code: HINT_CITED_AS_VALUE
        when: always
        requires: []
        cites:
        - docs/PLAINSIGHT-FOUNDATION.md D2
        - docs/THE-GAMEPLAN.md section 2.3 fixture 1
        statement: A citation's cited_as equals the cited claim's selector_type, or is null. An email_hint_recovery_masked
          claim cannot satisfy a citation for email. The registry's must_not_satisfy_citation_for is the
          source.
      - name: generated_requires_promotion
        code: GENERATED_CITED_AS_OBSERVED
        when: always
        requires: []
        cites:
        - docs/PLAINSIGHT-design.md section 4.6
        - docs/THE-GAMEPLAN.md section 2.3 fixture 2
        statement: A citation of a claim whose selector_type carries provenance_state GENERATED is refused
          unless an ADJUDICATE_EVENT PROMOTE with promotion_kind generated_to_observed exists for that
          claim.
      - name: cited_claim_adjudicated
        code: CITATION_UNADJUDICATED
        when: always
        requires: []
        cites:
        - docs/PLAINSIGHT-design.md section 4.5
        statement: A cited EXTRACT_EVENT has an ADJUDICATE_EVENT VERIFY. Adjudication on citation is the
          mechanism the design turns on.
      runtime_rules:
      - name: possible_band_needs_caveat
        code: CITATION_CAVEAT_MISSING
        when: runtime
        requires:
        - caveat
        cites:
        - docs/PLAINSIGHT-design.md section 5.5
        statement: A citation of an IDENTITY_EVENT CLUSTER with band possible carries a caveat.
        runtime_reason: The cited cluster's band is a field on another event, so this event cannot carry
          the condition and the check resolves the citation first.
      - name: gestalt_cited_needs_note
        code: RATIONALE_NOTE_MISSING
        when: runtime
        requires:
        - note
        cites:
        - docs/PLAINSIGHT-design.md section 5.5
        statement: A citation of an IDENTITY_EVENT CLUSTER whose rationale_codes contain g carries a note.
          IDENTITY_EVENT's external_knowledge_needs_note defers the g obligation to the export boundary
          rather than dropping it, and this is the export boundary, so without this rule the obligation
          is stated in one place and carried in none.
        runtime_reason: The cited cluster's rationale_codes are fields on another event.
      rendering_rules: []
      registry_fields: []
      retention:
        envelope_stratum: 2
        payload_stratum: 1
        carries_subject_values: true
      egress:
        envelope_crosses_to_local: true
        payload_crosses_to_local: false
