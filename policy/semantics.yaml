# Semantics policy: layers, denylists, and payload rules
#
# GENERATED by tools/generate_pse.py from spec/layer-model.yaml (layers, event_types.*.payload.prohibited, event_types.*.payload.rules).
# Do not edit by hand. Edit the model and regenerate; `tools/generate_pse.py --check`
# refuses any difference between this file and what the model generates.
# One top-level wrapper key, named after the file, as in zmeta-spec's policy
# files, so a loader unwraps it by name and a mistyped key fails closed.
#
semantics:
  version: pse-event-0.1
  generated_from: spec/layer-model.yaml
  generated_by: tools/generate_pse.py
  payload_denylist:
    mode: recursive
    nested_hit_code: LAYER_COLLAPSE_NESTED
    residual: A name denylist. A prohibited value re-keyed under a name the list does not carry passes
      the denylist; additionalProperties false at every level is what narrows that residual, and it is
      stated rather than claimed away.
  envelope_violation_codes:
  - SCHEMA_INVALID
  - VERSION_MISMATCH
  - CASE_ID_MISSING
  - EVENT_TYPE_UNKNOWN
  - EVENT_SUBTYPE_MISMATCH
  - ENUM_VALUE_INVALID
  - PAYLOAD_FIELD_MISSING
  - LAYER_COLLAPSE_NESTED
  - CREDENTIAL_VALUE_IN_PAYLOAD
  schema_error_map:
  - where: /pse_version or /derived_from
    keyword: const
    code: VERSION_MISMATCH
  - where: /case_id
    keyword: required or pattern
    code: CASE_ID_MISSING
  - where: /event/event_type
    keyword: enum
    code: EVENT_TYPE_UNKNOWN
  - where: /event/event_subtype, or the payload discriminator
    keyword: enum or const
    code: EVENT_SUBTYPE_MISMATCH
  - where: /payload, a required field of the subtype
    keyword: required
    code: PAYLOAD_FIELD_MISSING
  - where: /payload, a name in the type's payload_must_not_contain
    keyword: additionalProperties
    code: the group's code (S7-R5)
  - where: /confidence
    keyword: 'false'
    code: the type's confidence code
  - where: a registry-bound field
    keyword: enum
    code: SELECTOR_TYPE_UNREGISTERED
  - where: any other closed-set field
    keyword: enum or const
    code: ENUM_VALUE_INVALID
  - where: anywhere else
    keyword: any
    code: SCHEMA_INVALID
  readings:
    S7-R1: 'Which optional payload fields a subtype may carry. The model states required fields per subtype
      and field shapes per type, and with additionalProperties false on every branch the generator needs
      a rule. The rule: a field is legal on a subtype when it is required there; or when no subtype of
      the type requires it (a free optional, legal on every subtype of the type); or when a rule whose
      `when` names a field condition requires it, on the subtypes where that field is legal; or when a
      runtime rule requires it, on every subtype of the type, because a runtime condition cannot be bound
      to a subtype by the model. Enum-by-subtype fields follow their enum.'
    S7-R2: The shape of IDENTITY_EVENT member_seams. The model declares an object and says in a comment
      it maps a member id to the rationale codes that hold for that member. The generator emits an object
      whose property names are uuids and whose values are non-empty arrays drawn from the rationale-code
      enum.
    S7-R3: 'ASSESS_EVENT geo and the two raw_span arrays have no declared shape and are emitted open:
      geo as an object with no property constraint, raw_span as an array with no item constraint. The
      model owns their shape and does not state it, so the generator does not narrow it.'
    S7-R4: 'A field with `registry: ontology/selectors.yaml` is emitted as a closed enum of the registry''s
      selector keys, so the vocabulary is closed at the corpus boundary in the schema itself. A value
      outside it fails an enum keyword at a registry-bound path, which the runner names SELECTOR_TYPE_UNREGISTERED
      rather than ENUM_VALUE_INVALID. A registry change therefore stales the schema, and --check catches
      it.'
    S7-R5: 'A prohibited name at depth zero is refused twice: the schema refuses it as an unknown property,
      and the denylist refuses it by name. The runner maps the schema failure at a prohibited name to
      the prohibiting group''s own code, so the group''s code is the sole code and expect_only can hold.
      A prohibited name below depth zero can only arrive inside an open object, and there the denylist
      fires the group''s code and LAYER_COLLAPSE_NESTED together.'
    S7-R6: Lineage requiredness is taken from lineage.required_by_subtype at subtype granularity, not
      from required_envelope_fields, where the two disagree (AUTHORIZE EXTEND and REVOKE, COLLECT PERMITTED
      and REQUIRES_EXTENSION, SYSTEM RETENTION_RENEWAL). The finer statement wins.
    S7-R7: A required_parents entry whose fixture names a code_source rule emits that rule's code instead
      of LINEAGE_MISSING. PROBE_EVENT RUN_START without a COLLECT_EVENT PERMITTED parent therefore fires
      SUBJECT_NOT_AUTHORIZED, which is the D5 fixture's expectation and the model's own mapping.
  layers:
    authorization:
      purpose: Who may be a subject, and the gate's decision at dispatch.
      may_carry:
