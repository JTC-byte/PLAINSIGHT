        SWEEP_HEARTBEAT:
        - system_type
        - swept_count
        - next_due
        - state
        - reason
        RECONCILE_HEARTBEAT:
        - system_type
        - ledger_only_count
        - storage_only_count
        - next_due
        - state
        - reason
      payload_must_not_contain:
      - names:
        - value
        - offending_value
        - raw
        - content
        - body
        - text
        - selectors
        - selector_value
        code: DIAGNOSTIC_CARRIES_VALUE
        why: RT-19. A diagnostic records the code and the location, never the value it matched, or the
          telemetry becomes the PII surface the gate prevents.
      - names:
        - purpose
        - evidence_ref
        code: AUTHORIZATION_RECORD_INLINED
        why: A retention or diagnostic event that references the SS-4 record inlines stratum-1 material
          by naming its selectors or its purpose sentence. The reasoning that put these two on AUTHORIZE_EVENT
          applies to every stratum-2 event that references the same record (RT-2).
      - names:
        - members
        - cluster_id
        code: LAYER_FIELD_ABOVE_LAYER
        why: The system layer has no identity.
      - names:
        - confidence
        code: CONFIDENCE_PROHIBITED
        why: LAYER_FIELD_ABOVE_LAYER fires only where no narrower code names the field, and CONFIDENCE_PROHIBITED
          is the narrower code this type declares.
      - names:
        - sessionid
        - session_id
        - cookie
        - token
        - password
        - secret
        - argv
        - command
        - credential
        - credential_value
        code: CREDENTIAL_VALUE_IN_PAYLOAD
        why: CREDENTIAL_LIFECYCLE.md CR-3. CREDENTIAL_STATE carries the id and the state, never the value,
          and a diagnostic about a run names the run rather than its argv.
      confidence:
        rule: prohibited
        code: CONFIDENCE_PROHIBITED
      rules:
      - name: renewal_names_obligation
        code: FREEZE_RENEWAL_UNJUSTIFIED
        when:
          subtype: RETENTION_RENEWAL
        requires:
        - obligation
        - expected_resolution_on
        cites:
        - doctrine/RETENTION.md RT-17
        statement: RETENTION_RENEWAL carries obligation and expected_resolution_on. A renewal carrying
          neither is refused. This is what separates a freeze from a habit.
      - name: quarantine_has_exit
        code: CREDENTIAL_QUARANTINE_NO_EXIT
        when:
          field: state
          equals: quarantined
        requires:
        - exit_criterion
        cites:
        - doctrine/CREDENTIAL_LIFECYCLE.md CR-6
        statement: CREDENTIAL_STATE with state quarantined carries exit_criterion.
      - name: burn_is_finding
        code: CREDENTIAL_BURN_NO_FINDING
        when:
          field: state
          equals: burned
        requires:
        - finding_ref
        cites:
        - doctrine/CREDENTIAL_LIFECYCLE.md CR-7
        statement: CREDENTIAL_STATE with state burned carries finding_ref, pointing at the stratum-3 capability
          finding. A pool that loses credentials without recording why rediscovers the same rate limit.
      - name: reason_code_declared
        code: ENUM_VALUE_INVALID
        when:
          subtype: SCHEMA_VIOLATION
        requires:
        - reason_code
        cites:
        - docs/THE-GAMEPLAN.md section 2.1 policy/violation-codes.yaml row
        statement: SCHEMA_VIOLATION reason_code is a declared code in violation_codes.
      - name: reason_names_no_subject
        code: REASON_NAMES_SUBJECT
        when:
          field: reason
          present: true
        requires: []
        cites:
        - doctrine/RETENTION.md RT-2
        - doctrine/SUBJECT_SELECTION.md SS-4
        statement: reason states why the act was taken without naming or describing the subject. RETENTION_EXTENSION
          and RETENTION_FREEZE are stratum 2 and survive the shred, so a sentence that describes a person
          outlives the case material it describes, which RT-2 calls a defect rather than a judgment call.
      runtime_rules: []
      rendering_rules: []
      registry_fields: []
      retention:
        envelope_stratum: 2
        payload_stratum: 2
        carries_subject_values: false
      egress:
        envelope_crosses_to_local: true
        payload_crosses_to_local: true
