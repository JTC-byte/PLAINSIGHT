        sources: [doctrine/RETENTION.md RT-17 point 7, doctrine/RETENTION.md RT-12, "CLAUDE.md section 4"]
        refuses_as: |
          THE SECOND RENEWAL RENDERED THE SAME FROZEN LINE A THIRD TIME, WHICH IS
          THE STATE RT-17 POINT 7 REFUSES. policy/retention.yaml carries no string
