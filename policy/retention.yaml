            where: policy/retention.yaml retention.unratified U-16
            rule:  doctrine/DOCTRINE_STATUS.md, an unratified criterion refuses rather than permits
            moves: stamp one of the three options above in doctrine/DOCTRINE_STATUS.md and replace the mapping here; or refuse the second renewal until the escalation has somewhere to render
