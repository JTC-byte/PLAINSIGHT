            where: policy/retention.yaml retention.unratified U-03
            rule:  doctrine/DOCTRINE_STATUS.md, an unratified criterion refuses rather than permits
            moves: stamp one of the three options above in doctrine/DOCTRINE_STATUS.md and replace the four mappings here; or let the case shred on its existing retain_until

