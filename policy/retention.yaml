      - id: U-12
        change_class: F
        referenced_by: [incidental.reaches_stratum_0_blobs]
        question: >
          Does the 7 day incidental clock reach stratum-0 blobs, or only the
          derived stratum-1 rows?
        blocks: >
          Enforcement of the incidental TTL against the class it was written for.
        detail: >
          A channel subscription's stratum-0 response bytes contain bystander
          message text, so one blob is simultaneously raw capture at case TTL and
          incidental content at 7 days. RT-1 assigns the blob to case TTL and RT-6
          assigns the content inside it to 7 days, and both are stamped.
        legal_options:
          - The clock reaches stratum-1 derived rows only, so the raw bytes holding
            the same text survive to the case TTL and the shorter clock protects a
            projection rather than the source.
          - The clock reaches stratum-0 blobs whose content is incidental, which
            requires per-blob relation tagging at write time and destroys raw
            capture the case may still cite.
          - Bystander-dominant capture is written to its own partition from the
            first write, so the two clocks act on disjoint objects.
        sources: [doctrine/RETENTION.md RT-1, doctrine/RETENTION.md RT-6, doctrine/SUBJECT_SELECTION.md SS-11]
        refuses_as: |
          THE INCIDENTAL CONTENT WAS NOT SWEPT. policy/retention.yaml does not say
          which objects the 7 day clock reaches, so the sweep has nothing it can
          safely delete without reaching raw capture the case may still cite.
            where: policy/retention.yaml retention.unratified U-12
            rule:  doctrine/DOCTRINE_STATUS.md, an unratified criterion refuses rather than permits
            moves: stamp one of the three options above in doctrine/DOCTRINE_STATUS.md and replace the mapping here; or run no connector that reaches beyond its named selector

