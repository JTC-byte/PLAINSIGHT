      - id: U-05
        change_class: F
        consequential: true
        referenced_by:
          - freeze.expiry_settable_per_freeze
          - freeze.maximum_expiry_days
          - freeze.renewal_length_days
        question: >
          Is a freeze's expiry settable per freeze or fixed at the 30 day default?
          If it is settable, is there a maximum, and is a renewal's length settable
          independently of the first freeze's?
        blocks: >
          The sweep's refusal on a freeze whose expiry is set past the point where
          the escalation can ever be reached.
        why_this_one_matters: >
          RT-17's protection against a freeze becoming an archive is the escalating
          state, and the escalation counts renewals. A first freeze with an
          unbounded expiry reaches the same place in one logged act that twelve
          renewals would reach, and the second renewal render never fires. This is
          the one entry in this list where the wrong default silently removes a
          control rather than leaving a gap.
        legal_options:
          - Fixed at 30 days for every freeze and every renewal, which gives the
            escalation a predictable cadence and makes a long hold visibly many
            acts.
          - Settable, with a maximum the operator declares here.
          - Settable and unbounded, which is consistent with RT-17's refusal to cap
            the renewal count and leaves only the named obligation and the render
            standing against a single long freeze.
        sources: [doctrine/RETENTION.md RT-17 points 4, 6 and 7]
        refuses_as: |
          THE FREEZE WAS NOT APPLIED AND THE CASE REMAINS ON ITS ORDINARY SHRED
          PATH. policy/retention.yaml cannot say whether the requested expiry is
          legal, and RT-17's escalation cannot be relied on while the first
          freeze's length is undecided.
            where: policy/retention.yaml retention.unratified U-05
            rule:  doctrine/DOCTRINE_STATUS.md, an unratified criterion refuses rather than permits
            moves: stamp one of the three options above in doctrine/DOCTRINE_STATUS.md and replace the four mappings here; or apply a freeze at the stated 30 day default and renew it as a logged act

