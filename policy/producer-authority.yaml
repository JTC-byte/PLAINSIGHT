    SYSTEM_EVENT.CONNECTOR_HEALTH:
    - runner-*
    SYSTEM_EVENT.COVERAGE_INTERVAL:
    - runner-*
    SYSTEM_EVENT.RETENTION_EXTENSION:
    - <human identity>
    SYSTEM_EVENT.RETENTION_FREEZE:
    - <human identity>
    SYSTEM_EVENT.RETENTION_RENEWAL:
    - <human identity>
    SYSTEM_EVENT.SHRED_RECEIPT:
    - runner-*
    SYSTEM_EVENT.SHRED_FAILED:
    - runner-*
    SYSTEM_EVENT.CREDENTIAL_STATE:
