# Producer authority: who may emit which type and subtype
#
# GENERATED by tools/generate_pse.py from spec/layer-model.yaml (producer_authority, event_types.*.producer_authority).
# Do not edit by hand. Edit the model and regenerate; `tools/generate_pse.py --check`
# refuses any difference between this file and what the model generates.
# One top-level wrapper key, named after the file, as in zmeta-spec's policy
# files, so a loader unwraps it by name and a mistyped key fails closed.
#
producer_authority:
  version: pse-event-0.1
  generated_from: spec/layer-model.yaml
  generated_by: tools/generate_pse.py
  require_match_for_event_types:
  - AUTHORIZE_EVENT
  - COLLECT_EVENT
  - PROBE_EVENT
  - EXTRACT_EVENT
  - LINK_EVENT
  - IDENTITY_EVENT
  - ADJUDICATE_EVENT
  - ASSESS_EVENT
  - SYSTEM_EVENT
  violation_code: PRODUCER_NOT_ALLOWED
  fail_closed: true
  checked_before: any semantic check
  human_identity_marker: <human identity>
  human_identity_source: deployment configuration read by the runner; never a wildcard and never in a
    tracked file
  producers:
    runner-subject-guard:
      allowed:
      - COLLECT_EVENT.PERMITTED
      - COLLECT_EVENT.REQUIRES_EXTENSION
      - COLLECT_EVENT.REFUSED
    runner-*:
      allowed:
      - PROBE_EVENT.RUN_START
      - PROBE_EVENT.RUN_END
      - SYSTEM_EVENT.SCHEMA_VIOLATION
      - SYSTEM_EVENT.CONNECTOR_HEALTH
      - SYSTEM_EVENT.COVERAGE_INTERVAL
      - SYSTEM_EVENT.SHRED_RECEIPT
      - SYSTEM_EVENT.SHRED_FAILED
      - SYSTEM_EVENT.CREDENTIAL_STATE
      - SYSTEM_EVENT.SWEEP_HEARTBEAT
      - SYSTEM_EVENT.RECONCILE_HEARTBEAT
    manual:
      allowed:
      - PROBE_EVENT.RUN_START
      - PROBE_EVENT.ITEM
      - PROBE_EVENT.RUN_END
      - EXTRACT_EVENT.CLAIM
    connector-*:
      allowed:
      - PROBE_EVENT.ITEM
      - EXTRACT_EVENT.CLAIM
    extractor-*:
      allowed:
      - EXTRACT_EVENT.CLAIM
    matcher-*:
      allowed:
      - LINK_EVENT.SAME_ENTITY
      - LINK_EVENT.ASSOCIATED_WITH
      - LINK_EVENT.CO_LOCATED
      - LINK_EVENT.CONTROLS
  human_identity_only:
  - AUTHORIZE_EVENT.GRANT
  - AUTHORIZE_EVENT.EXTEND
  - AUTHORIZE_EVENT.REVOKE
  - IDENTITY_EVENT.CLUSTER
  - IDENTITY_EVENT.EXCLUDE
  - ADJUDICATE_EVENT.VERIFY
  - ADJUDICATE_EVENT.DISPUTE
  - ADJUDICATE_EVENT.PROMOTE
  - ADJUDICATE_EVENT.IGNORE
  - ADJUDICATE_EVENT.REVOKE
  - ADJUDICATE_EVENT.ACKNOWLEDGE
  - ADJUDICATE_EVENT.OVERRIDE
  - ADJUDICATE_EVENT.NOTE
  - ADJUDICATE_EVENT.QUESTION
  - ASSESS_EVENT.SENTENCE
  - SYSTEM_EVENT.RETENTION_EXTENSION
  - SYSTEM_EVENT.RETENTION_FREEZE
  - SYSTEM_EVENT.RETENTION_RENEWAL
  effective:
    AUTHORIZE_EVENT.GRANT:
    - <human identity>
    AUTHORIZE_EVENT.EXTEND:
    - <human identity>
    AUTHORIZE_EVENT.REVOKE:
    - <human identity>
    COLLECT_EVENT.PERMITTED:
    - runner-subject-guard
    COLLECT_EVENT.REQUIRES_EXTENSION:
    - runner-subject-guard
    COLLECT_EVENT.REFUSED:
    - runner-subject-guard
    PROBE_EVENT.RUN_START:
    - runner-*
    - manual
    PROBE_EVENT.ITEM:
    - connector-*
    - manual
    PROBE_EVENT.RUN_END:
    - runner-*
    - manual
    EXTRACT_EVENT.CLAIM:
    - connector-*
    - extractor-*
    - manual
    LINK_EVENT.SAME_ENTITY:
    - matcher-*
    LINK_EVENT.ASSOCIATED_WITH:
    - matcher-*
    LINK_EVENT.CO_LOCATED:
    - matcher-*
    LINK_EVENT.CONTROLS:
    - matcher-*
    IDENTITY_EVENT.CLUSTER:
    - <human identity>
    IDENTITY_EVENT.EXCLUDE:
    - <human identity>
    ADJUDICATE_EVENT.VERIFY:
    - <human identity>
    ADJUDICATE_EVENT.DISPUTE:
    - <human identity>
    ADJUDICATE_EVENT.PROMOTE:
    - <human identity>
    ADJUDICATE_EVENT.IGNORE:
    - <human identity>
    ADJUDICATE_EVENT.REVOKE:
    - <human identity>
    ADJUDICATE_EVENT.ACKNOWLEDGE:
    - <human identity>
    ADJUDICATE_EVENT.OVERRIDE:
    - <human identity>
    ADJUDICATE_EVENT.NOTE:
    - <human identity>
    ADJUDICATE_EVENT.QUESTION:
    - <human identity>
    ASSESS_EVENT.SENTENCE:
    - <human identity>
    SYSTEM_EVENT.SCHEMA_VIOLATION:
